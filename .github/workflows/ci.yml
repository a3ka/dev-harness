# CI инструмента: прогон всех проверок на ЧИСТОМ чекауте.
#
# Заведено потому, что ценность `tester` в этом репозитории — прогон на чистом дереве,
# а `actions/checkout` это дерево и даёт: ловит «работает на моём дереве» — незакоммиченный
# файл, отсутствующий сгенерированный артефакт, зависимость от локального окружения.
# Роли `tester` в репозитории поэтому нет — её заменяет этот workflow, и он обязан быть
# достаточным для этой замены.
#
# Что НЕ попадает сюда и почему — `config/ci_parity_exceptions.txt`. `check:overlay`
# требует бинаря omp 185 МБ, в CI его нет; `models:actual` требует трейс последней сессии;
# `gen:harness` и `overlay` — команды записи, прогонять их на чистом чекауте неправильно.
# Исключения объявлены с записанными причинами, а не молча.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Concurrency (контракт 020, Р2): каждый новый push/PR по одному рефу отменяет
# предыдущий прогон — иначе очередь из устаревших коммитов съедает слоты шардов
# (на судейской фазе 019 накоплено ~2 ч чистого ожидания CI; гейт 4б делает
# КАЖДОЕ ожидание блокером судейского конвейера). Группа привязана к рефу — разные
# ветки не отменяют друг друга; cancel-in-progress идёт на повторные пуши той же
# ветки и на обновления PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  antiplacebo:
    runs-on: ubuntu-latest
    # Р3 контракта 020: timeout шарда — 20 мин (запас 2,4× к средней цене шарда
    # 8,5 мин; см. §Профилировка). fail-fast: false — одна красная фикстура не
    # отменяет остальные шарды, иначе полный прогон теряет смысл (Н-63).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Р1 (контракт 020, v3.1): подъём шардов N=6 → N=5. v3.1 вынес `check_metering`
        # в отдельный шард ap6 (длинный шест, измерено профилировкой ~2,4× бюджета
        # остальных ключей ап5, без этого они упирались в timeout-minutes: 20,
        # см. историю отмен CI 5a0c560); сумма-инвариант в `scripts/verify_ci_parity.sh`
        # от числа шардов не зависит — сводка ключей динамическая. v3.2 ОТКАЗЫВАЕТСЯ от
        # шарда ap6 (контракт 020 v3.2, метеринг — флейки-выброс по решению владельца
        # 2026-09-17: требует живого прокси/upstream, красная фаза зависает на healthz
        # после рестарта `_restart_proxy_and_upstream`, замер 2026-09-17; маска Н-87 —
        # в --changed-CI почти не гейтил, полный прогон проходил раз; КОМПЕНСАЦИЯ:
        # ручной полный прогон перед done×4, cognitive-only остаток до де-флейка —
        # хвост 017, очередь нормализации). Каталог `fixtures/check_metering/` (22 case)
        # остаётся и покрывается сумма-инвариантом через ИМЕНОВАННОЕ исключение
        # `UNSCOPABLE_KEYS` в `scripts/verify_ci_parity.sh` — без шардного шага и
        # без присутствия в `keys:` какого-либо шарда (такое присутствие ломало бы
        # ап-шаг rc=1 «неизвестный ключ»). Прочие параметры (concurrency,
        # timeout-minutes, fetch-depth, node 26, fail-fast: false) — на месте.
        # Ключи — пути в scripts/ без расширения, через пробел. Имя
        # `npm run check:antiplacebo` — СТАТИЧНО (правило 6), шаблон только в --scope
        # (предмет п.1 «имя статично»).
        include:
          - shard: ap1
            keys: check_runner_hygiene drill_startup_digest check_ci_gate gc_agent_branches check_no_rewrite render_document next_id
          - shard: ap2
            keys: check_scope_select freeze_contract check_skills land_agent check_decisions check_check_contract_ready drill_nabludenia_nechitaemo overlay
          - shard: ap3
            keys: check_staged check_zones check_nabludenia check_scoped_run check_approval check_judge_gate spawn_agent
          - shard: ap4
            keys: check_protected check_hooks check_charter drill_gate_draft check_document drill_protected_exception
          - shard: ap5
            keys: verify_ci_parity check_ids check_ceilings check_contract_frozen drill_next_id_race drill_contract_change models_actual
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:protected` сверяет достижимую историю — тот же аргумент, что в
          # главной джобе (см. её checkout): на глубине 1 объединение достижимых
          # коммитов равно HEAD, барьер стал бы пусто-зелёным.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        # Node 26 — требование совместимости с прокси учёта под --permission
        # (флаг есть в node ≥ ~24/26). Совпадает с engines в package.json и с
        # версией в главной джобе.
        with:
          node-version: 26
      - name: Анти-плацебо · шард ${{ matrix.shard }}
        # Р1/предмет п.1: --scope задаёт КОНКРЕТНЫЕ ключи шарда (на которых
        # scope_select выберет case-*). --changed отменён — он видел только
        # последний пуш (Н-87) и не давал scoped-выбор.
        run: npm run check:antiplacebo -- --scope ${{ matrix.keys }}
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:protected` сверяет ВСЮ достижимую историю. На глубине 1 объединение
          # достижимых коммитов равно HEAD, и барьер стал бы пусто-зелёным — он это ловит и
          # отказывает, но лечить надо здесь, а не смягчением барьера.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        # Рантайм харнеса — node 26: прокси учёта под --permission ТРЕБУЕТ --allow-net (сетевой
        # permission-флаг есть только в node ≥ ~24/26; на node 22 флаг неизвестен → node падает,
        # прокси не стартует, зелёный контроль check_metering не устанавливается — измерено на CI
        # 2026-08-22, лог джоба 97044050302). engines>=26 (package.json) и эта версия — одно.
        with:
          node-version: 26

      - name: Проверка паритета с CI
        # Паритет проверяется САМИМ барьером, и он обязан пройти ДО остальных проверок:
        # иначе расхождение найдёт не эта команда, а следующая, и причина будет названа
        # не та. Самопроверка правила обязана стоять первой.
        run: npm run check:ci-parity

      - name: Проба слабых реализаций меры параллельности (контракт 021, И-7)
        # Условие V2 контракта 021 (Н-43): проба — не on-demand. CI обязан гонять её на
        # каждом пуше, иначе честность меры проверяется только в момент сдачи пачки и
        # деградирует молча между коммитами. Самодостаточна: фазы пробы строят подставные
        # корни в mktemp, красные входы против стабов и честную форму меры гоняют в
        # изоляции от чистого чекаута. rc-команда закрывает пункт приёмки шага (правило 6).
        run: npm run check:measure-probe

      - name: Барьер scoped-селектора (контракт 006)
        # Самодостаточен: строит игрушечные git-деревья в tmp/, git в CI есть.
        run: npm run check:scope-select

      - name: Барьер интеграции scoped в раннер (контракт 006)
        # Самодостаточен: встроенный scope_select из фикстуры, прогон через изолированный tmp.
        run: npm run check:scoped-run

      - name: Предполётный гейт автора (контракт 008)
        # Самодостаточен: на игрушечных деревьях гоняет scripts/check_contract_ready.sh
        # и УТВЕРЖДАЕТ код+причину; ветви зоны/проба/счёт/арбитраж/готов.
        run: npm run check:contract-ready

      - name: Doc-приёмка (контракт 027)
        # Самодостаточен: прогоняет 8 прямых red_doc_* на игрушечных деревьях
        # в mktemp (субъект — check_document.ts/render_document.ts); python3 и git
        # доступны. rc=0 закрывает пункт приёмки шага.
        run: npm run check:document

      - name: Судья через CI-сигнал (контракт 008)
        # Самодостаточен: подставляет ФЕЙКОВЫЙ check_ci_gate.sh рядом с предметом
        # judge_gate.sh, реагирующий на exact-matching SHA PASS_THIS_SHA_GREEN.
        run: npm run check:judge-gate

      - name: Гигиена раннера + форма нормы приёмки (контракт 011)
        # Красный тест: шаг красен, пока предмет 011 не реализован (lock/scratch/чистка
        # раннера + маркер ПРИЁМКА-СУДЬИ v2 + аннотация у 010 §Приёмка п.8). Зелёным
        # становится вместе с предметом; пуш пачки без предмета CI не проходит по умыслу.
        run: npm run check:runner-hygiene

      - name: Грамматика наблюдений (контракт 015)
        # Красный тест: шаг красен, пока предмет 015 не реализован (барьер
        # check_nabludenia + миграционная пачка адресов — один коммит введения).
        # Зелёным становится вместе с предметом; пуш пачки без предмета CI не
        # проходит по умыслу — тот же прецедент, что шаг контракта 011 выше.
        run: npm run check:nabludenia

      - name: Дрилл — черновик наблюдения на отказ гейта (контракт 015)
        # Зелёная ветвь фикстурой не выражается — дрилл-переворот по образцу 005.
        # Красен до реализации предмета по умыслу.
        run: npm run drill:gate-draft

      - name: Дрилл — дайджест старта сессии (контракт 015)
        # Зелёная ветвь фикстурой не выражается — дрилл-переворот по образцу 005.
        # Красен до реализации предмета по умыслу.
        run: npm run drill:startup-digest

      - name: Дрилл — нечитаемость файлов наблюдений (контракт 015)
        # rc=2 фикстурой не выражается (раннер трактует rc=2 как NOT_IMPLEMENTED) —
        # дрилл-переворот по РЕШЕНИЮ арбитража 3, спор 3 (прецедент 005).
        # Красен до реализации предмета по умыслу.
        run: npm run drill:nabludenia-nechitaemo

      - name: Генератор ролей под чек
        run: npm run check:gen

      - name: Selftest прокси учёта
        # Барьер по контракту 005, критерий 1: пять проверок внутренней логики —
        # periodAt на стыке месяцев, приписывание токена, свёртка журнала в бюджет
        # (int64 микро-USD), append-only запись, формула тарификации с округлением
        # вверх. Сети не требует: всё на `node:` builtins и локальных файлах.
        run: npm run metering:selftest

      - name: Проверка уникальности идентификаторов артефактов
        # Скрипт `scripts/check_ids.sh` написан по плану 005 §2.
        run: npm run check:ids

      - name: Скилы подлинны и комплектны
        # Барьер check_skills.sh: восемь ветвей — от обнаружения omp до сверки тел
        # с raw.githubusercontent по hash из замороженного контракта. Сеть в CI есть.
        run: npm run check:skills

      - name: Потолки документов
        # Барьер по контракту 004: потолки в байтах (51200 персон, 30720 правил) и раздел
        # «Незаполненные требования» у черновиков. Исключения паритета не нужны — без omp.
        run: npm run check:ceilings

      - name: "Реестр решений: состав и грамматика"
        # Скрипт `scripts/check_decisions.sh` написан по контракту 002 (критерий 2).
        # Семь записей 001-007 из `decisions/`, основания разрешимы и для 005-007
        # совпадают с хешами таблицы контракта.
        run: npm run check:decisions

      - name: Режим входа — политика подтверждений
        # Скрипт `scripts/check_approval.sh` написан по контракту 002 (критерий 1) после
        # находки 3 круга адверсария: статика `always-ask` в `.omp/config.yml` без
        # поведенческой пробы не держала ничего. Барьер поднимает лаунчер ПОДСТАВНЫМ omp
        # и сверяет, что запуск наследует конфиг дерева, а флаг отмены политики отвергнут.
        run: npm run check:approval

      - name: Механизм pre-commit коммичен (контракт 016, Q6)
        # Срез 1 контракта 016 — барьер add-A: проверка МЕХАНИЗМА установки хука, не рантайма.
        # Гейт add-A (check_staged) живёт в скрипте и на CI-дереве ставит staged пуст → rc 0.
        # Этот шаг — охрана того, что в дерево коммичены .githooks/pre-commit и установщик
        # core.hooksPath в package.json; без них свежий клон защиты не несёт.
        run: npm run check:hooks

      - name: Замороженные планы и контракты неизменны
        # Побайтовое сравнение с блобом высшей заморозки; вердикт критика проверяется на каждую
        # версию. До появления первой заморозки барьер зелёный по построению: тегов нет — нечего
        # сверять, и это законное состояние, а не дыра.
        run: npm run check:contract-frozen

      - name: Зоны исполнителей
        # Зоны читаются из блоба ВЫСШЕЙ заморозки контракта, не из рабочего дерева: иначе правка
        # файла расширяла бы зону без заморозки. Контрактов с зонами нет — законное «зон не
        # объявлено», не NOT_IMPLEMENTED.
        run: npm run check:zones

      - name: Устав не меняется без слова владельца
        # До тега ustav/1 барьер отвечает 2 NOT_IMPLEMENTED и НЕ работает — это его объявленная
        # единственная законная двойка. Появление тега включает его само, правки проводки не нужно.
        run: npm run check:charter

      - name: "Дрилл: изменение устава по процедуре принимается"
        # Зелёная ветвь фикстурой не выражается — анти-плацебо доказывает только красное. Третий
        # дрилл в проводке по той же причине, что первые два.
        run: npm run drill:contract-change

      - name: Дрилл — атомарность выдачи номеров
        # Второй дрилл в проводке, и по той же причине, что первый: анти-плацебо доказывает
        # только КРАСНОЕ, а «два вызова подряд дают РАЗНЫЕ номера» — зелёное утверждение.
        # Фикстурой оно не выражается, поэтому стоит отдельной строкой.
        run: npm run drill:next-id-race

      - name: Защищённые артефакты не исчезали
        run: npm run check:protected

      - name: "Дрилл: явное разрешение принимается"
        # Зелёная ветвь исключения фикстурой не выражается — анти-плацебо доказывает только
        # красное. Дрилл переворачивает полярность и потому стоит в проводке отдельной строкой.
        run: npm run drill:protected-exception

      - name: История не перезаписана
        # Единственное место, где прежняя вершина ветки ИЗВЕСТНА: локально её не знает никто,
        # поэтому она передаётся аргументом, а не выясняется догадкой. `check:protected` считает
        # «существовал» по графу, достижимому от HEAD, и перезапись выносит коммит из этого
        # графа — это его объявленная граница, и закрывает её вот эта строка.
        if: github.event_name == 'push'
        run: npm run check:no-rewrite -- "${{ github.event.before }}" "${{ github.sha }}"
