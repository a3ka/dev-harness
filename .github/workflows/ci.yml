# CI инструмента: прогон всех проверок на ЧИСТОМ чекауте.
#
# Заведено потому, что ценность `tester` в этом репозитории — прогон на чистом дереве,
# а `actions/checkout` это дерево и даёт: ловит «работает на моём дереве» — незакоммиченный
# файл, отсутствующий сгенерированный артефакт, зависимость от локального окружения.
# Роли `tester` в репозитории поэтому нет — её заменяет этот workflow, и он обязан быть
# достаточным для этой замены.
#
# Что НЕ попадает сюда и почему — `config/ci_parity_exceptions.txt`. `check:overlay`
# требует бинаря omp 185 МБ, в CI его нет; `models:actual` требует трейс последней сессии;
# `gen:harness` и `overlay` — команды записи, прогонять их на чистом чекауте неправильно.
# Исключения объявлены с записанными причинами, а не молча.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Concurrency (контракт 020, Р2): каждый новый push/PR по одному рефу отменяет
# предыдущий прогон — иначе очередь из устаревших коммитов съедает слоты шардов
# (на судейской фазе 019 накоплено ~2 ч чистого ожидания CI; гейт 4б делает
# КАЖДОЕ ожидание блокером судейского конвейера). Группа привязана к рефу — разные
# ветки не отменяют друг друга; cancel-in-progress идёт на повторные пуши той же
# ветки и на обновления PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  antiplacebo:
    runs-on: ubuntu-latest
    # Р3 контракта 020: timeout шарда — 30 мин (поднят с 20 живым укусом
    # 2026-10-02: ap4 (check_charter по 3-тысячной истории) дважды убит ровно
    # на 20:15 — runs 36956195239/36962813984, cancelled при зелёных прочих;
    # рост дал fetch-tags: true (Н-181). fail-fast: false — одна красная
    # фикстура не отменяет остальные шарды, иначе полный прогон теряет
    # смысл (Н-63).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Н-206: `pull_request`-событие по умолчанию чекаутит синтетический
          # `refs/pull/N/merge` (эфемерный коммит GitHub, диффящийся против
          # ТЕКУЩЕГО base) — ЛЮБОЙ PR, амендящий уже-frozen `contracts/*.md`,
          # навсегда красит `check_charter.sh` (диффит фантомный merge против
          # первого родителя). Явный `ref:` на реальный head_sha PR (fallback
          # на `github.sha` для push-события) — судим РЕАЛЬНУЮ ветку, не
          # фантом; contract 073 «merge-HEAD» самодостаточен (строит СВОИ
          # синтетические деревья в fixtures/zony_merge_head/, не зависит от
          # формы внешнего checkout).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # `check:protected` сверяет достижимую историю — тот же аргумент, что в
          # главной джобе (см. её checkout): на глубине 1 объединение достижимых
          # коммитов равно HEAD, барьер стал бы пусто-зелёным.
          fetch-depth: 0
          # Н-181: checkout точечного ref НЕ тащит теги (fetch-tags по умолчанию
          # false) — done-границы окон контрактов исчезали, окна открывались до
          # HEAD, и check_zones судил чужие freeze-registry коммиты без СПАСЕНО.
          fetch-tags: true
      - uses: actions/setup-node@v4
        # Node 26 — требование совместимости с прокси учёта под --permission
        # (флаг есть в node ≥ ~24/26). Совпадает с engines в package.json и с
        # версией в главной джобе.
        with:
          node-version: 26
      - name: Анти-плацебо · шард ${{ matrix.shard }}
        # Р1/предмет п.1: --scope задаёт КОНКРЕТНЫЕ ключи шарда (на которых
        # scope_select выберет case-*). --changed отменён — он видел только
        # последний пуш (Н-87) и не давал scoped-выбор.
        # Контракт 083, инвариант 5: include-блок ниже генерируется из
        # реестра `registry/ci-steps.tsv` (shard-строки) генератором
        # `scripts/gen_ci_steps.sh` и сверяется им же (--check). Правка
        # руками внутри блока красна поимённо.
        # Маркеры — в колонке 1 (требование оракула батареи 083, block_body
        # использует `index($0,marker)==1`). YAML трактует комментарии
        # одинаково на любой колонке; содержимое include — на 14 колонке
        # (как и в исходной джобе antiplacebo).
        strategy:
          fail-fast: false
          matrix:
            include:
# BEGIN GENERATED CI SHARDS (083)
# END GENERATED CI SHARDS (083)
        run: npm run check:antiplacebo -- --scope ${{ matrix.keys }}
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Н-206: та же причина, что в джобе `antiplacebo` (см. её checkout) —
          # без явного `ref:` эта джоба судит синтетический PR-merge-ref, а не
          # реальную ветку; `check:charter` ложно красит ЛЮБОЙ PR, амендящий
          # уже-frozen контракт/план.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # `check:protected` сверяет ВСЮ достижимую историю. На глубине 1 объединение
          # достижимых коммитов равно HEAD, и барьер стал бы пусто-зелёным — он это ловит и
          # отказывает, но лечить надо здесь, а не смягчением барьера.
          fetch-depth: 0
          # Н-181: те же done-теги для check_zones (окна контрактов) — без тегов
          # шаг «Зоны исполнителей» красит исторические freeze-registry коммиты.
          fetch-tags: true

      - uses: actions/setup-node@v4
        # Рантайм харнеса — node 26: прокси учёта под --permission ТРЕБУЕТ --allow-net (сетевой
        # permission-флаг есть только в node ≥ ~24/26; на node 22 флаг неизвестен → node падает,
        # прокси не стартует, зелёный контроль check_metering не устанавливается — измерено на CI
        # 2026-08-22, лог джоба 97044050302). engines>=26 (package.json) и эта версия — одно.
        with:
          node-version: 26

      - name: Проверка паритета с CI
        # Паритет проверяется САМИМ барьером, и он обязан пройти ДО остальных проверок:
        # иначе расхождение найдёт не эта команда, а следующая, и причина будет названа
        # не та. Самопроверка правила обязана стоять первой. Это ЕДИНСТВЕННЫЙ шаг
        # в джобе ci с `npm run` (правило 6 verify_ci_parity, контракт 083 инв. 2:
        # «не более одной run:-строки с npm run»); прочие шаги — `bash <path>` 4-я форма
        # (прецедент 058–080) либо `bash scripts/run_ci_lane.sh ${{ matrix.keys }}` lane-шаг.
        run: npm run check:ci-parity

      - name: Сам-тесты раннера анти-плацебо (арбитраж 020 c8aaa67, замер 5)
        # Замер 5 арбитража: 23 фикстуры `fixtures/verify_antiplacebo/` на МИНИМАЛЬНОМ
        # mktemp-корне (52 с стены — рецепт CI-шага дёшев, минуты CI не часы).
        # Раннер `scripts/verify_antiplacebo.sh` ЗАМОРОЖЕН в этом круге — копия в mktemp-корень,
        # не правка; фикстуры `fixtures/verify_antiplacebo/` — те же 23 case.
        # 4-я форма правила 6: `bash <path>` равно значению скрипта `check:antiplacebo-selftest`
        # в `package.json`. Имя `npm run check:antiplacebo` СТАТИЧНО; аргумент `$TMP_ROOT` ломает
        # равенство значению скрипта → оплата записью команда: в `ci_parity_exceptions.txt`
        # (та же механика, что у residual-оплат инварианта 4 — арбитраж c8aaa67, §Решение п.2).
        # Прямой вызов `bash scripts/verify_antiplacebo.sh …` в workflow НЕ писать — красный
        # флаг residual (см. замер 6: ветвь «барьер остался зелёным на обманном дереве»).
        run: bash scripts/antiplacebo_selftest.sh

      - name: Сам-тесты барьера check_threat_model (контракт 041)
        # Раннер fixtures/_krasnye_041.sh (dogfood-семья контракта 041,
        # тот же архитектурный класс, что «Сам-тесты семьи ПРОВОДКА» ниже):
        # 11 case_*.sh в fixtures/check_threat_model/ САМО-верифицирующие в
        # прямом режиме (rc собственной сборки). Ключ `check:threat-model-selftest`
        # в package.json равен значению шага (правило 6 verify_ci_parity.sh —
        # четвёртая форма, прецедент 058/059/060/063/070).
        run: bash fixtures/_krasnye_041.sh

      - name: Сам-тесты семьи ПРОВОДКА (контракт 038)
        # Раннер fixtures/_krasnye_038.sh (dogfood-семья контракта 038, тот же
        # архитектурный класс, что check_threat_model выше): 37 red_*/green_*.sh
        # трёх барьеров (check_provodka, done_contract, check_consumers) — прямой
        # запуск ВНЕ case_*-глоба шардового verify_antiplacebo. EXPECT_RC=0 — режим
        # `_krasnye_038.sh` для реализованного предмета.
        run: EXPECT_RC=0 bash fixtures/_krasnye_038.sh

      - name: Сам-тесты семьи окна потребителей 116 (контракт 062)
        # Прямой шаг ВНЕ антиплацебо-матрицы по прецеденту 058/059/060/063:
        # раннер `fixtures/check_consumers/krasnye_062.sh` (семья контракта 062,
        # ПРОВОДКА-канал контракта). Ключ `check:consumers-window-family-selftest`
        # в package.json равен значению шага (правило 6 verify_ci_parity.sh —
        # четвёртая форма, прецедент 058–080).
        run: bash fixtures/check_consumers/krasnye_062.sh

      - name: Проба слабых реализаций меры параллельности (контракт 021, И-7)
        # Условие V2 контракта 021 (Н-43): проба — не on-demand. CI обязан гонять её на
        # каждом пуше, иначе честность меры проверяется только в момент сдачи пачки и
        # деградирует молча между коммитами. Самодостаточна: фазы пробы строят подставные
        # корни в mktemp, красные входы против стабов и честную форму меры гоняют в
        # изоляции от чистого чекаута.
        run: bash fixtures/check_zones/probe_slabye_realizacii.sh

      - name: Барьер scoped-селектора (контракт 006)
        run: bash scripts/check_scope_select.sh

      - name: Барьер интеграции scoped в раннер (контракт 006)
        run: bash scripts/check_scoped_run.sh

      - name: Предполётный гейт автора (контракт 008)
        run: bash scripts/check_check_contract_ready.sh

      - name: Doc-приёмка (контракт 027)
        # Самодостаточен: прогоняет 8 прямых red_doc_* на игрушечных деревьях
        # в mktemp (субъект — check_document.ts/render_document.ts); python3 и git
        # доступны. Ключ `check:document` в package.json равен значению скрипта.
        run: bash scripts/check_document.sh

      - name: Пре-фриз precision-гейт (контракт 043)
        run: bash scripts/check_precision_gate.sh . contracts/043-precizionnyj-prefriz-gejt.md

      - name: Сам-тесты семьи precision-гейт (контракт 043)
        run: bash fixtures/_krasnye_043.sh

      - name: Батарея гигиены парсинга для precision-гейт (контракт 043)
        run: bash fixtures/parsing_hygiene_battery/run_battery.sh check_precision_gate

      - name: Сам-тесты pre-exchange гард (контракт 045)
        run: bash scripts/gitw check

      - name: Сам-тесты предполётного гарда gitw push в main (контракт 071)
        run: bash fixtures/_krasnye_071.sh

      - name: Сам-тесты дверей оркестратора (контракт 072)
        run: bash fixtures/_krasnye_072.sh

      - name: Сам-тесты шаринга agent.db (контракт 058)
        run: bash fixtures/_krasnye_058.sh

      - name: Сам-тесты сверки объявленных путей профиля (контракт 059)
        run: bash fixtures/_krasnye_059.sh

      - name: Сам-тесты самодостаточности репо (контракт 060)
        run: bash fixtures/_krasnye_060.sh

      - name: Сам-тесты GitHub-чтения (контракт 070)
        run: bash scripts/check_github_token_070.sh

      - name: Сам-тесты гейта зон на merge-HEAD (контракт 073)
        run: bash fixtures/_krasnye_073.sh

      - name: Сам-тесты серверной обвязки станции (контракт 074)
        run: bash fixtures/_krasnye_074.sh

      - name: Сам-тесты двери бугфикса перезапуска (контракт 080)
        run: bash fixtures/_krasnye_080.sh

      - name: Сам-тесты ворот слияния и CI из профиля (контракт 063)
        run: bash fixtures/check_judge_gate/krasnye_063.sh

      - name: Спек-точность пре-фриз (контракт 036, В4)
        run: bash scripts/check_spec_ready.sh . contracts/036-spec-tochnost-prefriz-gejt.md

      - name: Судья через CI-сигнал (контракт 008)
        run: bash scripts/check_judge_gate.sh

      - name: Гигиена раннера + форма нормы приёмки (контракт 011)
        run: bash scripts/check_runner_hygiene.sh

      - name: Грамматика наблюдений (контракт 015)
        run: bash scripts/check_nabludenia.sh

      - name: Дрилл — черновик наблюдения на отказ гейта (контракт 015)
        run: bash scripts/drill_gate_draft.sh

      - name: Дрилл — дайджест старта сессии (контракт 015)
        run: bash scripts/drill_startup_digest.sh

      - name: Дрилл — нечитаемость файлов наблюдений (контракт 015)
        run: bash scripts/drill_nabludenia_nechitaemo.sh

      - name: Генератор ролей под чек
        run: bash scripts/gen-harness.ts --check

      - name: Selftest прокси учёта
        run: bash scripts/proxy/metering_proxy.ts --selftest

      - name: Проверка уникальности идентификаторов артефактов
        run: bash scripts/check_ids.sh

      - name: Скилы подлинны и комплектны
        run: bash scripts/check_skills.sh

      - name: Потолки документов
        # Барьер по контракту 004: потолки в байтах (51200 персон, 30720 правил) и раздел
        # «Незаполненные требования» у черновиков. Исключения паритета не нужны — без omp.
        run: bash scripts/check_ceilings.sh

      - name: "Реестр решений: состав и грамматика"
        # Скрипт `scripts/check_decisions.sh` написан по контракту 002 (критерий 2).
        run: bash scripts/check_decisions.sh

      - name: Режим входа — политика подтверждений
        run: bash scripts/check_approval.sh

      - name: Механизм pre-commit коммичен (контракт 016, Q6)
        run: bash scripts/check_hooks.sh

      - name: Замороженные планы и контракты неизменны
        run: bash scripts/check_contract_frozen.sh

      - name: Зоны исполнителей
        run: bash scripts/check_zones.sh

      - name: Устав не меняется без слова владельца
        run: bash scripts/check_charter.sh

      - name: "Дрилл: изменение устава по процедуре принимается"
        run: bash scripts/drill_contract_change.sh

      - name: Дрилл — атомарность выдачи номеров
        run: bash scripts/drill_next_id_race.sh

      - name: Защищённые артефакты не исчезали
        run: bash scripts/check_protected.sh

      - name: "Дрилл: явное разрешение принимается"
        run: bash scripts/drill_protected_exception.sh

      - name: "Дрилл: честный перенос распознаётся"
        run: bash scripts/drill_protected_rename.sh

      - name: Счётчик git-вызовов check_zones (контракт 040, §Приёмка Р1)
        run: bash fixtures/check_zones/red_predel_git_vyzovov.sh

      - name: Счётчик git-вызовов check_protected (контракт 040, §Приёмка Р2)
        run: bash fixtures/check_protected/red_predel_git_vyzovov_ours.sh

      - name: История не перезаписана
        # Контракт 083, инвариант 2: статический пост-шаг джобы ci (НЕ команда пакета —
        # гейт `check:ci-parity` уже в начале, повторять запрещено). Аргументы
        # `github.event.before` и `github.sha` доступны в шаге workflow и не требуют
        # подстановки в реестре.
        if: github.event_name == 'push'
        run: bash scripts/check_no_rewrite.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Lane ${{ matrix.lane }}
        # Контракт 083, инвариант 2: джоба ci перестроена в матрицу из K параллельных
        # lane (K из meta-строки `lanes <K>` реестра, 6≤K≤8). Тело шага — ОДНОСТРОЧНЫЙ
        # скаляр с ЛИТЕРАЛЬНЫМ токеном `${{ matrix.keys }}` (иное неизвлекаемое значение —
        # клетка Г9 красна). Исполняется в cwd worktree, читает `registry/ci-steps.tsv`,
        # запускает команды ключей в порядке, останавливается на первом отказе именем ключа.
        # include-блок ниже — функция реестра: генерируется `scripts/gen_ci_steps.sh --write`
        # и сверяется `--check` (правка руками красна поимённо).
        strategy:
          fail-fast: false
          matrix:
            include:
# BEGIN GENERATED CI JOBS (083)
# END GENERATED CI JOBS (083)
        run: bash scripts/run_ci_lane.sh ${{ matrix.keys }}

      - name: Сам-тесты батареи 083 (генератор + исполнение + инкрементальность)
        # Прямой шаг ВНЕ матрицы по прецеденту 058/070/080: раннер `fixtures/_krasnye_083.sh`
        # гоняет `fixtures/ci_gen_083/red_ci_a_083.sh` — клетки Г0–Г9 (генератор и исполнение
        # lane), Г-С1/Г-С2 (стаб-пак), И0–И5 (инкрементальность check_charter),
        # И-валид/ниже/окно для check_zones/check_ids/check_protected, И-С1..И-С4 (стаб-пак
        # окна). Шаг вводится контрактом 083 как ПРОВОДКА-ЭНФОРСМЕНТ (та же механика, что у
        # сам-тестов семьи 038/041/043/045/071/080). Ключ `check:ci-family-selftest` в
        # package.json равен значению шага — правило 6 verify_ci_parity.sh (четвёртая форма,
        # прецедент 058–080). Самодостаточен: раннер строит toy-миры в mktemp-каталогах,
        # стерегомое дерево не мутирует, сети нет. Шаг красен, пока предмет 083 не
        # реализован (г0 «предмет отсутствует»); зелёным становится вместе с предметом;
        # rc=0 закрывает пункт приёмки шага (правило 6) и закрывает ПРОВОДКА-долг 083.
        run: bash fixtures/_krasnye_083.sh
