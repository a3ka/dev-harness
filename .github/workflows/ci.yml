# CI инструмента: прогон всех проверок на ЧИСТОМ чекауте.
#
# Заведено потому, что ценность `tester` в этом репозитории — прогон на чистом дереве,
# а `actions/checkout` это дерево и даёт: ловит «работает на моём дереве» — незакоммиченный
# файл, отсутствующий сгенерированный артефакт, зависимость от локального окружения.
# Роли `tester` в репозитории поэтому нет — её заменяет этот workflow, и он обязан быть
# достаточным для этой замены.
#
# Что НЕ попадает сюда и почему — `config/ci_parity_exceptions.txt`. `check:overlay`
# требует бинаря omp 185 МБ, в CI его нет; `models:actual` требует трейс последней сессии;
# `gen:harness` и `overlay` — команды записи, прогонять их на чистом чекауте неправильно.
# Исключения объявлены с записанными причинами, а не молча.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Concurrency (контракт 020, Р2): каждый новый push/PR по одному рефу отменяет
# предыдущий прогон — иначе очередь из устаревших коммитов съедает слоты шардов
# (на судейской фазе 019 накоплено ~2 ч чистого ожидания CI; гейт 4б делает
# КАЖДОЕ ожидание блокером судейского конвейера). Группа привязана к рефу — разные
# ветки не отменяют друг друга; cancel-in-progress идёт на повторные пуши той же
# ветки и на обновления PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  antiplacebo:
    runs-on: ubuntu-latest
    # Р3 контракта 020: timeout шарда — 30 мин (поднят с 20 живым укусом
    # 2026-10-02: ap4 (check_charter по 3-тысячной истории) дважды убит ровно
    # на 20:15 — runs 36956195239/36962813984, cancelled при зелёных прочих;
    # рост дал fetch-tags: true (Н-181). fail-fast: false — одна красная
    # фикстура не отменяет остальные шарды, иначе полный прогон теряет
    # смысл (Н-63).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Р1 (контракт 020, v3.1): подъём шардов N=6 → N=5. v3.1 вынес `check_metering`
        # в отдельный шард ap6 (длинный шест, измерено профилировкой ~2,4× бюджета
        # остальных ключей ап5, без этого они упирались в timeout-minutes: 20,
        # см. историю отмен CI 5a0c560); сумма-инвариант в `scripts/verify_ci_parity.sh`
        # от числа шардов не зависит — сводка ключей динамическая. v3.2 ОТКАЗЫВАЕТСЯ от
        # шарда ap6 (контракт 020 v3.2, метеринг — флейки-выброс по решению владельца
        # 2026-09-17: требует живого прокси/upstream, красная фаза зависает на healthz
        # после рестарта `_restart_proxy_and_upstream`, замер 2026-09-17; маска Н-87 —
        # в --changed-CI почти не гейтил, полный прогон проходил раз; КОМПЕНСАЦИЯ:
        # ручной полный прогон перед done×4, cognitive-only остаток до де-флейка —
        # хвост 017, очередь нормализации). Каталог `fixtures/check_metering/` (22 case)
        # остаётся и покрывается сумма-инвариантом через ИМЕНОВАННОЕ исключение
        # `UNSCOPABLE_KEYS` в `scripts/verify_ci_parity.sh` — без шардного шага и
        # без присутствия в `keys:` какого-либо шарда (такое присутствие ломало бы
        # ап-шаг rc=1 «неизвестный ключ»). Прочие параметры (concurrency,
        # timeout-minutes, fetch-depth, node 26, fail-fast: false) — на месте.
        # Ключи — пути в scripts/ без расширения, через пробел. Имя
        # `npm run check:antiplacebo` — СТАТИЧНО (правило 6), шаблон только в --scope
        # (предмет п.1 «имя статично»).
        include:
          - shard: ap1
            keys: check_runner_hygiene drill_startup_digest check_ci_gate gc_agent_branches orch_restart pre_critic check_no_rewrite render_document next_id
          - shard: ap2
            keys: check_scope_select freeze_contract check_skills land_agent check_decisions check_check_contract_ready check_check_spec_ready check_spec_ready drill_nabludenia_nechitaemo overlay check_provodka done_contract check_consumers
          - shard: ap3
            keys: check_staged check_zones check_nabludenia check_scoped_run check_approval check_judge_gate spawn_agent
          - shard: ap4
            keys: check_protected check_hooks check_charter drill_gate_draft check_document drill_protected_exception drill_protected_rename check_fork_route verify_consultant
          - shard: ap5
            keys: verify_ci_parity check_ids check_ceilings check_contract_frozen drill_next_id_race drill_contract_change models_actual check_threat_model profile_resolver
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:protected` сверяет достижимую историю — тот же аргумент, что в
          # главной джобе (см. её checkout): на глубине 1 объединение достижимых
          # коммитов равно HEAD, барьер стал бы пусто-зелёным.
          fetch-depth: 0
          # Н-181: checkout точечного ref НЕ тащит теги (fetch-tags по умолчанию
          # false) — done-границы окон контрактов исчезали, окна открывались до
          # HEAD, и check_zones судил чужие freeze-registry коммиты без СПАСЕНО.
          fetch-tags: true
      - uses: actions/setup-node@v4
        # Node 26 — требование совместимости с прокси учёта под --permission
        # (флаг есть в node ≥ ~24/26). Совпадает с engines в package.json и с
        # версией в главной джобе.
        with:
          node-version: 26
      - name: Анти-плацебо · шард ${{ matrix.shard }}
        # Р1/предмет п.1: --scope задаёт КОНКРЕТНЫЕ ключи шарда (на которых
        # scope_select выберет case-*). --changed отменён — он видел только
        # последний пуш (Н-87) и не давал scoped-выбор.
        run: npm run check:antiplacebo -- --scope ${{ matrix.keys }}
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:protected` сверяет ВСЮ достижимую историю. На глубине 1 объединение
          # достижимых коммитов равно HEAD, и барьер стал бы пусто-зелёным — он это ловит и
          # отказывает, но лечить надо здесь, а не смягчением барьера.
          fetch-depth: 0
          # Н-181: те же done-теги для check_zones (окна контрактов) — без тегов
          # шаг «Зоны исполнителей» красит исторические freeze-registry коммиты.
          fetch-tags: true

      - uses: actions/setup-node@v4
        # Рантайм харнеса — node 26: прокси учёта под --permission ТРЕБУЕТ --allow-net (сетевой
        # permission-флаг есть только в node ≥ ~24/26; на node 22 флаг неизвестен → node падает,
        # прокси не стартует, зелёный контроль check_metering не устанавливается — измерено на CI
        # 2026-08-22, лог джоба 97044050302). engines>=26 (package.json) и эта версия — одно.
        with:
          node-version: 26

      - name: Проверка паритета с CI
        # Паритет проверяется САМИМ барьером, и он обязан пройти ДО остальных проверок:
        # иначе расхождение найдёт не эта команда, а следующая, и причина будет названа
        # не та. Самопроверка правила обязана стоять первой.
        run: npm run check:ci-parity

      - name: Сам-тесты раннера анти-плацебо (арбитраж 020 c8aaa67, замер 5)
        # Замер 5 арбитража: 23 фикстуры `fixtures/verify_antiplacebo/` на МИНИМАЛЬНОМ
        # mktemp-корне (52 с стены — рецепт CI-шага дёшев, минуты CI не часы).
        # Раннер `scripts/verify_antiplacebo.sh` ЗАМОРОЖЕН в этом круге — копия в mktemp-корень,
        # не правка; фикстуры `fixtures/verify_antiplacebo/` — те же 23 case.
        # Имя `npm run check:antiplacebo` СТАТИЧНО (правило 6); аргумент `$TMP_ROOT` ломает
        # равенство значению скрипта → оплата записью команда: в `ci_parity_exceptions.txt`
        # (та же механика, что у residual-оплат инварианта 4 — арбитраж c8aaa67, §Решение п.2).
        # Прямой вызов `bash scripts/verify_antiplacebo.sh …` в workflow НЕ писать — красный
        # флаг residual (см. замер 6: ветвь «барьер остался зелёным на обманном дереве»).
        run: |
          TMP_ROOT="/tmp/dev-harness-antiplacebo-selftest-$$"
          trap 'rm -rf "$TMP_ROOT"' EXIT
          mkdir -p "$TMP_ROOT/scripts"
          mkdir -p "$TMP_ROOT/fixtures/verify_antiplacebo"
          cp scripts/verify_antiplacebo.sh "$TMP_ROOT/scripts/verify_antiplacebo.sh"
          cp -r fixtures/verify_antiplacebo/. "$TMP_ROOT/fixtures/verify_antiplacebo/"
          npm run check:antiplacebo -- "$TMP_ROOT"

      - name: Сам-тесты барьера check_threat_model (контракт 041)
        # Раннер fixtures/_krasnye_041.sh (dogfood-семья контракта 041,
        # тот же архитектурный класс, что «Сам-тесты семьи ПРОВОДКА» ниже):
        # 11 case_*.sh в fixtures/check_threat_model/ САМО-верифицирующие в
        # прямом режиме (rc собственной сборки) И одновременно несут шапку
        # `# ПРИЧИНА:` стандартного case-протокола шардового
        # verify_antiplacebo.sh (scripts/verify_antiplacebo.sh:611-614) —
        # конверсия закрыла находку Н1 verdicts/review/contracts-041-k1.md:
        # ключ `check_threat_model` теперь ОБЫЧНЫЙ шардируемый барьер (шард
        # ap5 выше), SELF_COVERED_KEYS-исключение для него в
        # scripts/verify_ci_parity.sh — устаревший follow-up ВНЕ зоны
        # architect (не config/, не verify_ci_parity.sh), implementer
        # снимает отдельным проходом. Этот шаг ОСТАЁТСЯ рядом с шардом —
        # НЕ дублирование, а прямой прогон fixtures/_krasnye_041.sh как
        # такового (§Приёмка Р11 контракта 041 называет именно эту команду);
        # раннер строит mktemp-корни внутри, не мутирует стерегомое дерево.
        # rc-команда закрывает пункт приёмки шага (правило 6). Оплата —
        # запись `check:threat-model-selftest = <причина>` в
        # config/ci_parity_exceptions.txt (устаревший текст записи —
        # тот же follow-up, что и SELF_COVERED_KEYS выше).
        run: npm run check:threat-model-selftest

      - name: Сам-тесты семьи ПРОВОДКА (контракт 038)
        # Раннер fixtures/_krasnye_038.sh (dogfood-семья контракта 038, тот же
        # архитектурный класс, что check_threat_model выше): 37 red_*/green_*.sh
        # трёх барьеров (check_provodka, done_contract, check_consumers) — прямой
        # запуск ВНЕ case_*-глоба шардового verify_antiplacebo (А-82), написаны
        # под протокол приёмочной таблицы контракта 038, не под шардовый
        # `# ПРИЧИНА:`-протокол. Найдено ревьюером без единого вызывающего в CI
        # (verdicts/review/contracts-038-k1.md, Р2) — раннер жив и зелен, но не
        # подключён. Ключи check_provodka/done_contract/check_consumers УЖЕ в
        # шарде ap2 (30 case_*.sh) — этот шаг НЕ дублирует шард и НЕ входит в
        # SELF_COVERED_KEYS (scripts/verify_ci_parity.sh:1245): ключи остаются
        # покрытыми шардингом как раньше, а эта строка закрывает ОСТАЛЬНЫЕ 37
        # предъявлений таблицы (R-/D-/C- red_*/green_*), которые шардовый
        # раннер не видит по имени файла. EXPECT_RC=0 — режим `_krasnye_038.sh`
        # для реализованного предмета (интерактивный режим по умолчанию — 1,
        # для пред-предметного красного). rc-команда закрывает пункт приёмки
        # шага (правило 6); отдельной записи в config/ci_parity_exceptions.txt
        # не требуется — `npm run check:provodka-family-selftest` покрыт
        # правилом 6 (:1043) как `npm run <имя>`, тот же случай, что
        # `check:threat-model-selftest` (см. запись в конце exceptions.txt).
        run: npm run check:provodka-family-selftest

      - name: Сам-тесты семьи окна потребителей 116 (контракт 062)
        # Прямой шаг ВНЕ антиплацебо-матрицы по прецеденту 058/059/060/063:
        # раннер `fixtures/check_consumers/krasnye_062.sh` (семья контракта 062,
        # ПРОВОДКА-канал контракта: `guard=fixtures/check_consumers/krasnye_062.sh`)
        # гоняет `fixtures/check_consumers/red_atribucija_okna_062.sh` —
        # честные клетки к1..к8 (к1 — чужой ленд писателя НЕ судится,
        # к7 — правка-и-возврат СВОИМИ коммитами судится, к8 — отказ добычи окна
        # именованным rc 1) плюс стаб-пак из 6 обманных стабов и 6 диффпроб
        # (6/6 + 6/6 + 8/8). Шардовый verify_antiplacebo выбирает только
        # `case_*.sh`, этой семьи НЕ видит (её файл — `red_atribucija_okna_062.sh`,
        # не `case_*`). Ключ `npm run check:consumers-window-family-selftest` в
        # package.json равен значению шага (правило 6 verify_ci_parity.sh —
        # четвёртая форма, прецедент 058/059/060/063). Самодостаточен: батарея
        # строит toy-мир в mktemp-каталогах, стерегомое дерево не мутирует, сети
        # нет. Шаг красен, пока предмет 062 не реализован (г0 «предмет
        # отсутствует»); зелёным становится вместе с предметом; rc=0 закрывает
        # пункт приёмки шага (правило 6) и закрывает ПРОВОДКА-долг контракта 062.
        run: bash fixtures/check_consumers/krasnye_062.sh

      - name: Проба слабых реализаций меры параллельности (контракт 021, И-7)
        # Условие V2 контракта 021 (Н-43): проба — не on-demand. CI обязан гонять её на
        # каждом пуше, иначе честность меры проверяется только в момент сдачи пачки и
        # деградирует молча между коммитами. Самодостаточна: фазы пробы строят подставные
        # корни в mktemp, красные входы против стабов и честную форму меры гоняют в
        # изоляции от чистого чекаута. rc-команда закрывает пункт приёмки шага (правило 6).
        run: npm run check:measure-probe

      - name: Барьер scoped-селектора (контракт 006)
        # Самодостаточен: строит игрушечные git-деревья в tmp/, git в CI есть.
        run: npm run check:scope-select

      - name: Барьер интеграции scoped в раннер (контракт 006)
        # Самодостаточен: встроенный scope_select из фикстуры, прогон через изолированный tmp.
        run: npm run check:scoped-run

      - name: Предполётный гейт автора (контракт 008)
        # Самодостаточен: на игрушечных деревьях гоняет scripts/check_contract_ready.sh
        # и УТВЕРЖДАЕТ код+причину; ветви зоны/проба/счёт/арбитраж/готов.
        run: npm run check:contract-ready

      - name: Doc-приёмка (контракт 027)
        # Самодостаточен: прогоняет 8 прямых red_doc_* на игрушечных деревьях
        # в mktemp (субъект — check_document.ts/render_document.ts); python3 и git
        # доступны. rc=0 закрывает пункт приёмки шага.
        run: npm run check:document

      - name: Пре-фриз precision-гейт (контракт 043)
        # Самодостаточен: новая sibling-проверка, введённая контрактом 043 —
        # проверяет три свойства черновика (зона-коллизия union, живая
        # полярность case-файлов, паритет CI). freeze_contract.sh вызывает
        # тот же гейт перед записью тега (см. scripts/freeze_contract.sh
        # §6а-ter); CI-проводка здесь закрывает «заморозка без CI» (Б4).
        # Запускается ПОСЛЕ check:ci-parity: паритет CI проверяется отдельным
        # шагом раньше, чтобы красный паритет был виден как самостоятельный
        # результат, а не только как именованная причина задачи (в) гейта.
        # rc=0 закрывает пункт приёмки шага; семейная CI-приёмка Р10/Р11 проводится
        # двумя прямыми шагами ниже — см. §Приёмка контракта 043.
        # Контракт 072, инвариант 15 (npm-гигиена ног двери перед критиком):
        # ключ check:precision-gate в package.json безаргументный; аргументы
        # (. <контракт>) передаются здесь явно, чтобы «npm run … -- . <contract>»
        # судил переданный черновик, а не запечённый в ключе.
        run: npm run check:precision-gate -- . contracts/043-precizionnyj-prefriz-gejt.md

      - name: Сам-тесты семьи precision-гейт (контракт 043)
        # Прямой шаг ВНЕ антиплацебо-матрицы по прецеденту 038/041: раннер
        # `fixtures/_krasnye_043.sh` (dogfood-семья контракта 043) гоняет
        # ВСЕ 18 red_*/green_*-файлов семей `check_precision_gate/`,
        # структурно заявляющих полярность (`red_`/`green_`); шардовый
        # verify_antiplacebo выбирает только `case_*.sh` (scripts/verify_antiplacebo.sh:585)
        # и этой семьи НЕ видит (её файлы — `red_*/green_*`, не `case_*`).
        # Тот же архитектурный класс, что и ранее подключённые
        # «Сам-тесты семьи ПРОВОДКА (контракт 038)» / «Сам-тесты барьера
        # check_threat_model (контракт 041)». Ключ `npm run check:precision-family-selftest`
        # покрыт правилом 6 verify_ci_parity.sh (:1043) как `npm run <имя>`,
        # тот же случай, что `check:provodka-family-selftest` /
        # `check:threat-model-selftest` — запись в config/ci_parity_exceptions.txt
        # НЕ требуется. rc=0 закрывает пункт приёмки шага (правило 6).
        run: npm run check:precision-family-selftest

      - name: Батарея гигиены парсинга для precision-гейт (контракт 043)
        # Прямой шаг ВНЕ антиплацебо-матрицы по прецеденту 038/041: раннер
        # `fixtures/parsing_hygiene_battery/run_battery.sh check_precision_gate`
        # (реиспользуемая батарея контракта 041, применённая как dogfood для
        # 043) гоняет четыре класса гигиены парсинга против barriers-а
        # семьи — delimiter-collision, regex-injection, silent-drop,
        # self-application-green. Без прямого шага CI исполняет только
        # `check:precision-gate` (self-application) и пропускает регрессию
        # гигиены парсинга — ровно класс дефекта Н-113/Н-115, ради
        # которого контракт заведён (арбитраж 043-Б4 §Решение, прецедент
        # 038/041). Ключ `npm run check:precision-battery` покрыт правилом 6
        # verify_ci_parity.sh (:1043) как `npm run <имя>`, тот же случай,
        # что `check:precision-family-selftest` выше — запись в
        # config/ci_parity_exceptions.txt НЕ требуется. rc=0 закрывает
        # пункт приёмки шага (правило 6).
        run: npm run check:precision-battery


      - name: Сам-тесты pre-exchange гард (контракт 045)
        # Прямой шаг ВНЕ антиплацебо-матрицы по прецеденту 038/041/043: раннер
        # `fixtures/_krasnye_045.sh` (dogfood-семья контракта 045) гоняет
        # `fixtures/gitw/red_gitw_obmen.sh` — батарею 12 клеток (г0–г12)
        # плюс стаб-пак из 11 обманных реализаций — против `scripts/gitw`
        # (pre-exchange гард цели push/fetch/pull, единый корень Н-141+Н-143
        # +Н-148 + probe C). Шардовый verify_antiplacebo выбирает только
