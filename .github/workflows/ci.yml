# CI инструмента: прогон всех проверок на ЧИСТОМ чекауте.
#
# Заведено потому, что ценность `tester` в этом репозитории — прогон на чистом дереве,
# а `actions/checkout` это дерево и даёт: ловит «работает на моём дереве» — незакоммиченный
# файл, отсутствующий сгенерированный артефакт, зависимость от локального окружения.
# Роли `tester` в репозитории поэтому нет — её заменяет этот workflow, и он обязан быть
# достаточным для этой замены.
#
# Что НЕ попадает сюда и почему — `config/ci_parity_exceptions.txt`. `check:overlay`
# требует бинаря omp 185 МБ, в CI его нет; `models:actual` требует трейс последней сессии;
# `gen:harness` и `overlay` — команды записи, прогонять их на чистом чекауте неправильно.
# Исключения объявлены с записанными причинами, а не молча.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:protected` сверяет ВСЮ достижимую историю. На глубине 1 объединение
          # достижимых коммитов равно HEAD, и барьер стал бы пусто-зелёным — он это ловит и
          # отказывает, но лечить надо здесь, а не смягчением барьера.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        # engines требует node>=22 (package.json); без явной версии раннер ставит что попало
        with:
          node-version: 22

      - name: Проверка паритета с CI
        # Паритет проверяется САМИМ барьером, и он обязан пройти ДО остальных проверок:
        # иначе расхождение найдёт не эта команда, а следующая, и причина будет названа
        # не та. Самопроверка правила обязана стоять первой.
        run: npm run check:ci-parity

      - name: Анти-плацебо
        run: npm run check:antiplacebo

      - name: Барьер scoped-селектора (контракт 006)
        # Самодостаточен: строит игрушечные git-деревья в tmp/, git в CI есть.
        run: npm run check:scope-select

      - name: Барьер интеграции scoped в раннер (контракт 006)
        # Самодостаточен: встроенный scope_select из фикстуры, прогон через изолированный tmp.
        run: npm run check:scoped-run

      - name: Генератор ролей под чек
        run: npm run check:gen

      - name: Selftest прокси учёта
        # Барьер по контракту 005, критерий 1: пять проверок внутренней логики —
        # periodAt на стыке месяцев, приписывание токена, свёртка журнала в бюджет
        # (int64 микро-USD), append-only запись, формула тарификации с округлением
        # вверх. Сети не требует: всё на `node:` builtins и локальных файлах.
        run: npm run metering:selftest

      - name: Проверка уникальности идентификаторов артефактов
        # Скрипт `scripts/check_ids.sh` написан по плану 005 §2.
        run: npm run check:ids

      - name: Скилы подлинны и комплектны
        # Барьер check_skills.sh: восемь ветвей — от обнаружения omp до сверки тел
        # с raw.githubusercontent по hash из замороженного контракта. Сеть в CI есть.
        run: npm run check:skills

      - name: Потолки документов
        # Барьер по контракту 004: потолки в байтах (51200 персон, 30720 правил) и раздел
        # «Незаполненные требования» у черновиков. Исключения паритета не нужны — без omp.
        run: npm run check:ceilings

      - name: "Реестр решений: состав и грамматика"
        # Скрипт `scripts/check_decisions.sh` написан по контракту 002 (критерий 2).
        # Семь записей 001-007 из `decisions/`, основания разрешимы и для 005-007
        # совпадают с хешами таблицы контракта.
        run: npm run check:decisions

      - name: Режим входа — политика подтверждений
        # Скрипт `scripts/check_approval.sh` написан по контракту 002 (критерий 1) после
        # находки 3 круга адверсария: статика `always-ask` в `.omp/config.yml` без
        # поведенческой пробы не держала ничего. Барьер поднимает лаунчер ПОДСТАВНЫМ omp
        # и сверяет, что запуск наследует конфиг дерева, а флаг отмены политики отвергнут.
        run: npm run check:approval

      - name: Замороженные планы и контракты неизменны
        # Побайтовое сравнение с блобом высшей заморозки; вердикт критика проверяется на каждую
        # версию. До появления первой заморозки барьер зелёный по построению: тегов нет — нечего
        # сверять, и это законное состояние, а не дыра.
        run: npm run check:contract-frozen

      - name: Зоны исполнителей
        # Зоны читаются из блоба ВЫСШЕЙ заморозки контракта, не из рабочего дерева: иначе правка
        # файла расширяла бы зону без заморозки. Контрактов с зонами нет — законное «зон не
        # объявлено», не NOT_IMPLEMENTED.
        run: npm run check:zones

      - name: Устав не меняется без слова владельца
        # До тега ustav/1 барьер отвечает 2 NOT_IMPLEMENTED и НЕ работает — это его объявленная
        # единственная законная двойка. Появление тега включает его само, правки проводки не нужно.
        run: npm run check:charter

      - name: "Дрилл: изменение устава по процедуре принимается"
        # Зелёная ветвь фикстурой не выражается — анти-плацебо доказывает только красное. Третий
        # дрилл в проводке по той же причине, что первые два.
        run: npm run drill:contract-change

      - name: Дрилл — атомарность выдачи номеров
        # Второй дрилл в проводке, и по той же причине, что первый: анти-плацебо доказывает
        # только КРАСНОЕ, а «два вызова подряд дают РАЗНЫЕ номера» — зелёное утверждение.
        # Фикстурой оно не выражается, поэтому стоит отдельной строкой.
        run: npm run drill:next-id-race

      - name: Защищённые артефакты не исчезали
        run: npm run check:protected

      - name: "Дрилл: явное разрешение принимается"
        # Зелёная ветвь исключения фикстурой не выражается — анти-плацебо доказывает только
        # красное. Дрилл переворачивает полярность и потому стоит в проводке отдельной строкой.
        run: npm run drill:protected-exception

      - name: История не перезаписана
        # Единственное место, где прежняя вершина ветки ИЗВЕСТНА: локально её не знает никто,
        # поэтому она передаётся аргументом, а не выясняется догадкой. `check:protected` считает
        # «существовал» по графу, достижимому от HEAD, и перезапись выносит коммит из этого
        # графа — это его объявленная граница, и закрывает её вот эта строка.
        if: github.event_name == 'push'
        run: npm run check:no-rewrite -- "${{ github.event.before }}" "${{ github.sha }}"
