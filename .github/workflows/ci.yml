# CI инструмента: прогон всех проверок на ЧИСТОМ чекауте.
#
# Заведено потому, что ценность `tester` в этом репозитории — прогон на чистом дереве,
# а `actions/checkout` это дерево и даёт: ловит «работает на моём дереве» — незакоммиченный
# файл, отсутствующий сгенерированный артефакт, зависимость от локального окружения.
# Роли `tester` в репозитории поэтому нет — её заменяет этот workflow, и он обязан быть
# достаточным для этой замены.
#
# Что НЕ попадает сюда и почему — `config/ci_parity_exceptions.txt`. `check:overlay`
# требует бинаря omp 185 МБ, в CI его нет; `models:actual` требует трейс последней сессии;
# `gen:harness` и `overlay` — команды записи, прогонять их на чистом чекауте неправильно.
# Исключения объявлены с записанными причинами, а не молча.
#
# Контракт 087 (И-8): проводка CI-Б — классы изменений, тяжёлый результат по хешу
# кодового дерева. Джобы `klass`, `legkij`, `vorota`, `obshchij`, `ci`, `antiplacebo`,
# `tyazhelyj-itog`. Решение klass выдаёт outputs kod и tyazh: учётный пуш
# (только легие правки U) идёт в `legkij`, кодовый (U не совпадает) — также в
# `vorota` + тяжёлые джобы (`obshchij`/`ci`/`antiplacebo`) на дереве без учётных
# путей (первый шаг каждой — `strip`); `tyazhelyj-itog` сеет артефакт
# `tyazhelyj-<H>` для приёма на следующем кодовом пуше. `cancel-in-progress`
# снят контрактом 087 И-8: учётный пуш проверяется ≤ 2 мин, тяжёлое идёт
# только на кодовом пуше через PR-прогон, и серия пушей в одну PR более не
# должна отменять ранее зелёные тяжёлые прогоны (каждый из них сохраняется
# артефактом и нужен для приёма следующего пуша — `vorota` и `check_ci_gate`).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  # ДЖОБА klass (контракт 087 И-8) — классификатор пуска. Один шаг с id `reshenie`,
  # который через GITHUB_TOKEN вызывает `scripts/ci_klass.sh reshenie` и печатает
  # три строки: `kod=<H>`, `tyazh=reuse|run`, `istochnik=<sha>|-` → outputs kod и
  # tyazh. Выполняется БЕЗ условий (всегда на push и pull_request).
  klass:
    runs-on: ubuntu-latest
    outputs:
      kod: ${{ steps.reshenie.outputs.kod }}
      tyazh: ${{ steps.reshenie.outputs.tyazh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: reshenie
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci_klass.sh reshenie >> "$GITHUB_OUTPUT"

  # ДЖОБА vorota (контракт 087 И-8) — пуш в main без доказательства. Только на
  # push (pull_request не приземляется в main напрямую); `ci_klass.sh vorota` —
  # отказ rc 1 «код в main только через PR», если head_sha не имеет тяжёлого
  # прогона (артефакта tyazhelyj-<H>) по тому же H. Окружение GITHUB_TOKEN — для
  # анонимного запроса GitHub API достаточно публичного endpoint, токен
  # поднимает лимит запросов в час.
  vorota:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Код в main только через PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci_klass.sh vorota ${{ github.event.before }} ${{ github.sha }}

  # ДЖОБА legkij (контракт 087 И-2, И-8) — лёгкое задание ≤ 2 мин. Без условий
  # (всегда на push и pull_request): инкрементальный charter/zones/ids/protected
  # (--incr 083) + check:nabludenia + check:contract-frozen. Один run-шаг —
  # `bash scripts/run_ci_lane.sh <ключи legkij реестра по порядку>`. Пост-шаг
  # check_no_rewrite — на push, в этой же джобе (контракт 087 И-8: «кеши --incr
  # 083 и check_no_rewrite (push) — в legkij»); форма — cognitive-only, ловец —
  # стена А7 и ревьюер.
  legkij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Н-181: теги done-границ контрактов нужны check:zones через --incr —
          # без них окна контрактов открывались бы до HEAD, и зоны судили
          # чужие freeze-registry коммиты без СПАСЕНО.
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Лёгкое задание (устав, зоны, ids, protected, грамматика 015)
        run: bash scripts/run_ci_lane.sh check:charter check:zones check:ids check:protected check:nabludenia check:contract-frozen
      - name: История не перезаписана
        if: github.event_name == 'push'
        run: bash scripts/check_no_rewrite.sh "${{ github.event.before }}" "${{ github.sha }}"

  # ДЖОБА obshchij (контракт 087 И-8) — не-матричная тяжёлая джоба: общие шаги
  # однажды (контракт 087 И-8: `npm run check:ci-parity` и сам-тесты раннера
  # анти-плацебо — только здесь; в `ci`/`antiplacebo` нет). Первый run-шаг —
  # strip (дерево без учётных путей); условие `needs.klass.outputs.tyazh == 'run'`
  # (кодовый пуш: тяжёлое идёт только при наличии доказательства; учётный пуш —
  # пропуск, тиажёлые шаги не нужны). Без strategy — не матричная.
  obshchij:
    needs: klass
    if: needs.klass.outputs.tyazh == 'run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - run: bash scripts/ci_klass.sh strip ${{ needs.klass.outputs.kod }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Проверка паритета с CI
        run: npm run check:ci-parity
      - name: Сам-тесты раннера анти-плацебо
        run: |
          TMP_ROOT="/tmp/dev-harness-antiplacebo-selftest-$$"
          trap 'rm -rf "$TMP_ROOT"' EXIT
          mkdir -p "$TMP_ROOT/scripts" "$TMP_ROOT/fixtures/verify_antiplacebo"
          cp scripts/verify_antiplacebo.sh "$TMP_ROOT/scripts/verify_antiplacebo.sh"
          cp -r fixtures/verify_antiplacebo/. "$TMP_ROOT/fixtures/verify_antiplacebo/"
          npm run check:antiplacebo -- "$TMP_ROOT"
      - name: Сам-тесты батареи 087 (классификатор, ворота, проводка ci.yml)
        run: bash fixtures/_krasnye_087.sh

  # ДЖОБА antiplacebo (контракт 087 И-8) — матричная тяжёлая джоба шардов.
  # needs klass, if klass.outputs.tyazh == 'run', первый run-шаг — strip.
  # include-блок ниже генерируется `scripts/gen_ci_steps.sh` (контракт 083
  # инвариант 5).
  antiplacebo:
    needs: klass
    if: needs.klass.outputs.tyazh == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
# BEGIN GENERATED CI SHARDS (083)
          - shard: ap1
            keys: check_runner_hygiene drill_startup_digest check_ci_gate gc_agent_branches orch_restart pre_critic check_no_rewrite render_document next_id
          - shard: ap2
            keys: check_scope_select freeze_contract check_skills land_agent check_decisions check_check_contract_ready check_check_spec_ready check_spec_ready drill_nabludenia_nechitaemo overlay check_provodka done_contract check_consumers
          - shard: ap3
            keys: check_staged check_zones check_nabludenia check_scoped_run check_approval check_judge_gate spawn_agent
          - shard: ap4
            keys: check_protected check_hooks check_charter drill_gate_draft check_document drill_protected_exception drill_protected_rename check_fork_route verify_consultant
          - shard: ap5
            keys: verify_ci_parity check_ids check_ceilings check_contract_frozen drill_next_id_race drill_contract_change models_actual check_threat_model profile_resolver
# END GENERATED CI SHARDS (083)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - run: bash scripts/ci_klass.sh strip ${{ needs.klass.outputs.kod }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Анти-плацебо · шард ${{ matrix.shard }}
        run: npm run check:antiplacebo -- --scope ${{ matrix.keys }}

  # ДЖОБА ci (контракт 087 И-8) — матричная тяжёлая джобы `ci`. needs klass,
  # if klass.outputs.tyazh == 'run', первый run-шаг — strip. Ровно ДВА run-шага
  # (strip + lane; К9 батареи). include-блок ниже генерируется
  # `scripts/gen_ci_steps.sh --write` и сверяется `--check` (контракт 083
  # инвариант 5; правка руками красна поимённо).
  ci:
    needs: klass
    if: needs.klass.outputs.tyazh == 'run'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
# BEGIN GENERATED CI JOBS (083)
          - lane: l1
            keys: check:gitw-predpolet-family-selftest
          - lane: l2
            keys: check:orch-restart-family-selftest check:gitw-family-selftest check:watchdog-082-family-selftest metering:selftest check:hooks check:measure-probe check:scope-select
          - lane: l3
            keys: check:protected-call-budget check:merge-gate-family-selftest check:zony-merge-head-family-selftest check:ceilings check:contract-ready check:precision-battery check:scoped-run
          - lane: l4
            keys: check:samodostatochnost-family-selftest check:declared-path-family-selftest check:provodka-family-selftest drill:next-id-race check:decisions check:precision-family-selftest check:spec-ready-036
          - lane: l5
            keys: check:sharing-family-selftest check:document check:runner-hygiene drill:protected-exception check:gen check:skills drill:gate-draft
          - lane: l6
            keys: check:zones-call-budget check:door-bugfix-family-selftest check:v-polete-nichego-088-family-selftest drill:protected-rename check:github-token-family-selftest check:threat-model-selftest drill:nabludenia-nechitaemo
          - lane: l7
            keys: check:approval check:cikl-perezapuska-085-family-selftest check:ops-server-family-selftest drill:contract-change check:consumers-window-family-selftest check:judge-gate check:precision-gate-043 drill:startup-digest
# END GENERATED CI JOBS (083)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - run: bash scripts/ci_klass.sh strip ${{ needs.klass.outputs.kod }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Lane ${{ matrix.lane }}
        run: bash scripts/run_ci_lane.sh ${{ matrix.keys }}

  # ДЖОБА tyazhelyj-itog (контракт 087 И-8) — сеятель доказательства тяжёлого
  # прогона по кодовому хешу. needs klass + три тяжёлые джобы (obshchij,
  # antiplacebo, ci); условие — needs.klass.outputs.tyazh == 'run' (только кодовые
  # пуши создают доказательство). Артефакт `tyazhelyj-<H>` (`<H>` — kod из
  # klass.outputs) — индекс для `ci_klass.sh dokaz` при следующем кодовом пуше
  # (И-3). retention-days: 90 — деградация скорости после 90 дней, не
  # корректности (И-3 деградация списка по длине страницы).
  tyazhelyj-itog:
    needs: [klass, obshchij, antiplacebo, ci]
    if: needs.klass.outputs.tyazh == 'run'
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' "${{ needs.klass.outputs.kod }}" > tyazhelyj.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tyazhelyj-${{ needs.klass.outputs.kod }}
          path: tyazhelyj.txt
          retention-days: 90