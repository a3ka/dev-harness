# Провайдеры системы-разработчика.
#
# Заведён потому, что без него вызовы шли бы ПРЯМО к провайдеру: без потолка расхода и без
# строки в гроссбухе. У фабрики это правило записано прямо — «ВСЕ провайдеры с ключевой
# аутентификацией обязаны иметь baseUrl = адрес metering-proxy», — а инструмент, которым мы
# её строим, тратил бы ту же квоту невидимо.
#
# Квота MiniMax общая на текст, речь, картинки и музыку. Значит работа исполнителя и синтез
# речи фабрики едят один и тот же остаток: без учёта потолок стоит на месте, а квота тает.
#
# Адрес берётся из окружения, а не зашит: критерий переносимости. Прокси поднимает ПРОЕКТ,
# и `scripts/overlay.sh` отказывается работать, если модель провайдера с ключом назначена,
# а прокси не задан.

providers:
  minimax:
    baseUrl: "${METERING_PROXY_URL}"
