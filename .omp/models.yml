# Провайдеры системы-разработчика.
#
# Заведён потому, что без него вызовы шли бы ПРЯМО к провайдеру: без потолка расхода и без
# строки в гроссбухе. У фабрики это правило записано прямо — «ВСЕ провайдеры с ключевой
# аутентификацией обязаны иметь baseUrl = адрес metering-proxy», — а инструмент, которым мы
# её строим, тратил бы ту же квоту невидимо.
#
# Квота MiniMax общая на текст, речь, картинки и музыку. Значит работа исполнителя и синтез
# речи фабрики едят один и тот же остаток: без учёта потолок стоит на месте, а квота тает.
#
# Адрес берётся из окружения, а не зашит: критерий переносимости. Прокси поднимает ПРОЕКТ,
# и `scripts/overlay.sh` отказывается работать, если модель провайдера с ключом назначена,
# а прокси не задан.

providers:
  minimax:
    baseUrl: "${METERING_PROXY_URL}"
    # Токен нужен так же, как адрес: прокси — не открытый ретранслятор. Пропущен в первой
    # редакции, и вызовы отвергались бы на входе. Найдено сверкой с конфигом фабрики, где
    # оба поля объявлены рядом.
    # Ключ прокси — ссылка на токен роли, а не на общий токен прокси. Прежняя
    # редакция хранила `METERING_PROXY_TOKEN` — тот самый общий токен, и атрибуция
    # по ролям не работала: прокси видел все вызовы под одним владельцем, и
    # контракт 005 §2 «приписывание роли токеном» повисал. Теперь ссылка вида
    # `${METERING_TOKEN_<ROLE>}` (omp подставляет роль из текущего вызова),
    # и ветвь (з) барьера грепает именно такой шаблон: буквального значения
    # токена в репозитории нет — оно живёт в `~/.config/dev-harness/secrets.env`
    # как `METERING_TOKEN_<ROLE>=...`, и прокси строит карту токен→роль
    # чтением этого файла на каждый запрос.
    #
    # Поле названо `apiKey` по требованию omp. Прокси ждёт в `Authorization: Bearer
    # <значение>` ту же строку, что omp сюда подставил — токен роли, а не
    # служебный ключ провайдера.
    apiKey: "${METERING_TOKEN_<ROLE>}"
