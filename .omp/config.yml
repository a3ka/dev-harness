# Конфигурация системы-РАЗРАБОТЧИКА. Отдельная от фабрики намеренно.
#
# Как харнес различает, над чем мы работаем: по КАТАЛОГУ ПРОЕКТА, а не по догадке.
# omp читает `.omp/config.yml` и `AGENTS.md` из корня открытого проекта. Измерено
# 2026-08-15: в каталоге фабрики `omp config list` печатает её `modelRoles`, в этом
# каталоге до появления файла строки `modelRoles` не было вовсе — то есть открытие
# каталога и есть переключение системы. Два репозитория — два конфига — два набора
# ролей. Ничего общего, ничего выводимого из контекста.

modelRoles:
  # architect — автор конструкции: барьер, проба и обманные стабы одной пачкой.
  slow: "anthropic/claude-opus-5"

  # adversary — ломает пробу стабами, которые она пропускает. ДРУГОЕ семейство, чем
  # у автора: критерий независимости судьи. Совпадение семейств означало бы, что
  # адверсарий наследует рамку автора, а не проверяет её.
  advisor: "openai-codex/gpt-5.6-terra"

  # arbiter — разрешает тупик: два отказа по одной причине либо три круга.
  # `claude-fable-5` одного семейства с автором, и это НЕ упущение: арбитр судит спор
  # двух сторон, уже разведённых по семействам, поэтому «другое семейство» для него
  # неисполнимо по построению. Независимость покупается механизмом — свежий контекст,
  # первоисточники вместо пересказа, перепроверка спорного ЗАМЕРОМ по коду.
  # 1M контекста здесь не роскошь: арбитр обязан прочесть предмет и ВСЕ вердикты
  # кругов, а свод устава дал их шесть.
  plan: "anthropic/claude-fable-5"

  # Массовые шаги разработчика: чтение, поиск, сборка контекста.
  default: "anthropic/claude-sonnet-5"
  smol: "anthropic/claude-haiku-4-5"
  # implementer — дешёвая кодовая полоса. Ровно так устроен внешний проект: dev-роли
  # идут через MiniMax, а премиальные роли на этой полосе помечены как FALLBACK.
  # MiniMax-M3: 1M контекста, vision есть. Именно он УЖЕ объявлен в маршруте прокси учёта
  # фабрики для chat completions — брать другую модель значило бы завести второй маршрут.
  #
  # Своя роль модели, а НЕ `default`: `default` — модель живой сессии, и ей vision нужен.
  # У нас записан инцидент, когда MiniMax без vision «тестировал» интерфейс (R13), поэтому
  # несоответствие модели задаче проверяется механизмом, а не памятью.
  task: "minimax/MiniMax-M3"
  vision: "anthropic/claude-sonnet-5"
