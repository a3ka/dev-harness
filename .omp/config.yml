# Конфигурация системы-РАЗРАБОТЧИКА. Отдельная от фабрики намеренно.
#
# Как харнес различает, над чем мы работаем: по КАТАЛОГУ ПРОЕКТА, а не по догадке. omp читает
# `.omp/config.yml` и `AGENTS.md` из корня открытого проекта. Измерено 2026-08-15: в каталоге
# фабрики `omp config list` печатает её `modelRoles`, здесь — свои.

# ── СТРАЖ ЗАПИСИ (контракт 025) ────────────────────────────────────────────────
# deny-паттерны баш-записи с относительным операндом — ночные формы Н-85 (sed -i,
# printf >>, >). Глоб «*» матчит любые символы; правило побеждает по первому
# совпадению команды целиком или одного сегмента (omp://settings.md «Bash command
# approval patterns»). Досягаемость доказана живыми пробами A/B3 круга 2: ГЛАВНЫЕ
# сессии и ДОЧЕРНИЕ task-сессии получают именованный отказ по deny-правилу из
# проектного config. Три раздельных правила — по одному на класс ночного операнда
# (sed -i / printf / echo-reidirect), чтобы не сводить всё к одному «*»-правилу
# (декой «deny *» умирает на канарейках чтения И-3). Судится РАСПАРСЕННЫМ
# рантаймом (omp config get bash.patterns --json), не текстом файла — декой-
# комментарии не попадают в массив.
bash:
  patterns:
    - match: "*sed -i *"
      approval: deny
    - match: "* >> *"
      approval: deny
    - match: "* > *"
      approval: deny
    - match: "ruby -e *"
      approval: deny
    - match: "node -e *"
      approval: deny
    - match: "php -r *"
      approval: deny

# ── ПОЛИТИКА ПОДТВЕРЖДЕНИЙ (контракт 002, критерий 1) ─────────────────────────
# Режим входа — свойство СЕССИИ, а не её инвентаря. Прежняя конструкция делила
# входы на `--talk` (чтение) и `--work` (полный инвентарь), и обещание «в
# разговоре править нельзя» держалось ОТСУТСТВИЕМ инструментов. Измеренный
# дефект: переключение режима требовало перезапуска сессии, а слово владельца
# «работай» терялось вместе с контекстом. `always-ask` переводит режим в
# политику подтверждений omp — каждый инструмент спрашивает разрешения, и
# инвентарь один на сессию.
tools:
  approvalMode: always-ask

# ── modelRoles: СГЕНЕРИРОВАНО из config/agent_models.json — правь только там ──
modelRoles:
  default: "zai/glm-5.3"  # фолбек (декларация Н-50): anthropic/claude-sonnet-5
  vision: "minimax/MiniMax-M3"
  task: "minimax/MiniMax-M3"  # фолбек (декларация Н-50): anthropic/claude-sonnet-5
  smol: "minimax/MiniMax-M2.5-lightning"
  slow: "zai/glm-5.3"  # фолбек (декларация Н-50): anthropic/claude-opus-5
  advisor: "openai-codex/gpt-5.6-terra"  # фолбек (декларация Н-50): anthropic/claude-opus-5
  apex: "openai-codex/gpt-6-astra"  # фолбек (декларация Н-50): anthropic/claude-opus-5
  audit: "anthropic/claude-opus-5"  # фолбек (декларация Н-50): openai-codex/gpt-5.6-sol
  plan: "anthropic/claude-fable-5"  # фолбек (декларация Н-50): anthropic/claude-opus-5
  steward: "anthropic/claude-haiku-4-5"  # фолбек (декларация Н-50): openai-codex/gpt-5.6-luna
# ── /modelRoles ──

# ── Изоляция спавна субагентов (решение владельца 2026-08-26, шаг А контракта 012) ─
# Параллельные пачки architect/implementer не контендятся за живое дерево: каждое
# дерево процесса в своём сабволюме. Включается ВСТРОЕННОЙ harness-фичей, НЕ
# кодом раннера и НЕ нашим скриптом (иначе — обход, см. Н-48, замер шага 1: два
# параллельных verify над живым деревом — оба RC=1 «FAIL дерево изменилось»,
# 279с/29с, воспроизведено дважды).
task:
  isolation:
    mode: btrfs
