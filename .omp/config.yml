# Конфигурация системы-РАЗРАБОТЧИКА. Отдельная от фабрики намеренно.
#
# Как харнес различает, над чем мы работаем: по КАТАЛОГУ ПРОЕКТА, а не по догадке. omp читает
# `.omp/config.yml` и `AGENTS.md` из корня открытого проекта. Измерено 2026-08-15: в каталоге
# фабрики `omp config list` печатает её `modelRoles`, здесь — свои.
#
# ── Раскладка моделей: решение владельца 2026-08-16 ──────────────────────────────────────
# Подписка Anthropic обслуживает НЕСКОЛЬКО проектов владельца, значит она общий ограниченный
# ресурс и её надо экономить. Квота MiniMax дешёвая и расширяемая. Отсюда правило: дорогое
# семейство берётся ТОЧЕЧНО и редко, массовая работа идёт на дешёвом.
#
# Второе основание, измеренное: расход MiniMax проходит через прокси учёта и попадает в
# гроссбух, а расход Anthropic не считается НИГДЕ — ни в прокси, ни в трейсе. Перевод массовой
# работы на MiniMax делает её расход не только дешевле, но и ВИДИМЫМ.

modelRoles:
  # Живая сессия: собеседник владельца и оркестратор. Самый крупный потребитель квоты, потому
  # что работает непрерывно. 1M контекста и vision — кадры смотрят глазами.
  default: "minimax/MiniMax-M3"
  vision: "minimax/MiniMax-M3"

  # implementer — делает по написанному плану; массовая кодовая работа.
  # MiniMax-M3 уже объявлен в маршруте прокси учёта фабрики для chat completions: брать другую
  # модель значило бы завести второй маршрут.
  task: "minimax/MiniMax-M3"

  # Мелкие шаги: перечисления, короткие выборки. Дешёвое на дешёвом.
  smol: "minimax/MiniMax-M2.5-lightning"

  # architect — автор конструкции. Решение владельца 2026-08-17: роль переведена с
  # `anthropic/claude-opus-5` (5/25 за миллион токенов) на GLM от z.ai. Причина — цена: опус был
  # единственным местом, где дорогая подписка тратилась штатно, и владелец решил, что она здесь не
  # оправдана.
  #
  # Ключ провайдера — `ZAI_API_KEY` в `.env` (файл в .gitignore). Идентификатор модели объявляет
  # провайдер, а не мы: `omp models zai --json` печатает список; расходится — правится эта строка.
  #
  # Учёт расхода — открытый вопрос, названный прямо: `scripts/overlay.sh` требует прокси учёта
  # только от провайдеров из списка `KEYED='minimax'`, поэтому z.ai проходит мимо проверки. Пока
  # маршрут не заведён, расход GLM не считается нигде.
  slow: "zai/glm-5.3"

  # adversary и reviewer — судьи. Вне семейства автора: с переводом сессии на MiniMax автором
  # стало оно, и OpenAI остаётся другим семейством.
  advisor: "openai-codex/gpt-5.6-terra"

  # critic — гейт ПЕРЕД заморозкой плана. Решение владельца 2026-08-17: топ чужого
  # семейства, а не тот же `advisor`, что у судей реализации. Топ определён МЕРОЙ, а не
  # вкусом: внутри поколения 5.6 у провайдера три уровня цены — luna 0.2/1.2, terra 2/12,
  # sol 5/30 за миллион токенов (`omp models openai-codex --json`, замер 2026-08-17). Верхний
  # уровень — sol, он и стоит здесь.
  #
  # Цена оправдана этапом, а не важностью роли: дорогая проверка стоит на дешёвом этапе, а
  # план — самый дешёвый этап, какой есть. Измерено: три версии критерия готовности шага 5
  # оплачены переписыванием 12, 35 и 8 фикстур. Критик запускается один раз на план или
  # контракт, реализаций в этот момент не существует.
  apex: "openai-codex/gpt-5.6-sol"

  # arbiter — разрешает тупик; созывается редко, поэтому дорогая модель здесь почти ничего не
  # стоит, а 1M контекста нужен: он читает предмет и ВСЕ вердикты кругов. Теперь это ТРЕТЬЕ
  # семейство относительно автора-MiniMax, то есть его независимость только выросла.
  plan: "anthropic/claude-fable-5"
