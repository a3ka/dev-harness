# mobile.yml вызывает один same-run скрипт; тело workflow НЕ судит
# взаимный порядок Jest и проверки происхождения.
name: mobile
on:
  push:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: bash e2e-erstinformation/batareja/progon_sroka.sh .. ../harness
      - run: npm run lint
