# 150 — МОДЕЛЬ обвязки причинного замера обрыва (prichinnyy-zamer-obryva).
# Закрытый КАНОН обёртки (решение владельца 2026-11-12, S2 §1.3): батарея
# принимает ТОЛЬКО отрендеренный канон и отказывает любому отклонению
# именованной причиной; симуляции семантики GitHub Actions в батарее нет.
# Три представителя покрывают всю грамматику канона:
#   e2e-proba-obryv   — F1: прямой вызов bash mobile/scripts/zamer_obryva.sh;
#   e2e-proba-drugoj  — F2: npm-lane `npm run ci:zamer -- <kmd> …`
#                       (совместимость с 163: закрытая привязка lane к
#                       пиннованному скрипту, без eval);
#   e2e-proba-matrica — матричный job канона 143 v3 с ДВУМЯ child: замер
#                       child — ДОЧЕРНИЙ ХУК mobile/scripts/zamer_child_hook.sh
#                       внутри run-ci-screen.cjs (сэмплер до экранного
#                       исполнения, stdout/stderr Maestro в диагностический ns,
#                       сбор до повтора/finally); внешний шаг вокруг job
#                       причинный замер child не обеспечивает.
# Реальные работники продукта (legacy-пять 143/1, e2e-gespraech-vhod 147/1,
# e2e-vkladki 148/1, интеграция e2e-pilot 995) сохраняют СВОИ экраные тела
# дословно (И-15 143/2); обёртка вставляется ВОКРУГ их экраного шага без
# правки тел. Тела экраных шагов здесь — МИНИМАЛЬНЫЕ ПРЕДСТАВИТЕЛИ (boot/
# priemka/cleanup маркеры канона 143/141): форма экрана судится батареями
# 143/147/148/995, батарея 150 судит ТОЛЬКО замер.
#
# Управляющее окружение: продукт main несёт root defaults.run.working-
# directory: mobile — модель СОГЛАСОВАНА с продуктом (та же запись). Канон
# обёртки не зависит ни от каких defaults: каждый шаг замера несёт ЯВНЫЕ
# shell: bash (= bash --noprofile --norc -eo pipefail {0}) и
# working-directory: ${{ github.workspace }} (S2 §1.3: нормальный продукт —
# не злонамеренная мутация; смена root/job defaults семантику шагов замера
# не меняет).
name: mobile
on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
defaults:
  run:
    working-directory: mobile
jobs:
  select-screens:
    runs-on: [self-hosted, linux, x64, complior]
    outputs:
      e2e-proba-obryv: ${{ steps.vybor.outputs.e2e-proba-obryv }}
      e2e-proba-drugoj: ${{ steps.vybor.outputs.e2e-proba-drugoj }}
      matrix: ${{ steps.vybor.outputs.matrix }}
    steps:
      - run: echo 'sluzhebnyj vybor (kanon 143 — zdes' predstavlen)'
  build-apk:
    runs-on: [self-hosted, linux, x64, complior]
    steps:
      - run: echo 'sluzhebnaja sborka (kanon 143 — zdes'' predstavlena)'
  e2e-proba-obryv:
    needs: [select-screens, build-apk]
    if: needs.select-screens.outputs['e2e-proba-obryv'] == 'true'
    runs-on: [self-hosted, linux, x64, kvm, complior]
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      - name: Изоляция раннера (/home недоступен коду из PR)
        run: test ! -e /home/harness/.ssh && test ! -e /home/harness/dev-harness
      # ── обёртка 150, шаг 1/3: сэмплер ДО экраного шага ─────────────────
      - name: 'Замер обрыва: запуск сэмплера (150)'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ZAMER_EKRAN: proba-obryv
          ZAMER_NS: mobile/maestro-out-proba
          ZAMER_SERIAL: emulator-5571
        run: |
          set -euo pipefail
          bash mobile/scripts/zamer_obryva.sh start \
            --ekran "$ZAMER_EKRAN" --ns "$ZAMER_NS" --serial "$ZAMER_SERIAL" \
            --spool .zamer-$ZAMER_EKRAN \
            || echo 'ZAMER_START_NE_UDALSJA (zamer idet bez semplera)' >&2
      # ── экранный шаг работника (представитель; в продукте — тело экрана) ──
      - name: 'Экранная пачка (представитель экранного шага)'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PORT=5571
          SERIAL="emulator-$PORT"
          echo "ekrannoj shag: boot + priemka + odin POVTOR po signature (kanon 143/141)"
          exit 1
      # ── обёртка 150, шаг 2/3: гейт + сбор ПОСЛЕ экраного шага ───────────
      - name: 'Замер обрыва: сбор причинного снимка (150)'
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ZAMER_EKRAN: proba-obryv
          ZAMER_NS: mobile/maestro-out-proba
          ZAMER_SERIAL: emulator-5571
        run: |
          set -u
          bash mobile/scripts/zamer_obryva.sh sbor \
            --ekran "$ZAMER_EKRAN" --ns "$ZAMER_NS" --serial "$ZAMER_SERIAL" \
            --spool .zamer-$ZAMER_EKRAN --out mobile/zamer-out-$ZAMER_EKRAN
      # ── обёртка 150, шаг 3/3: публикация if:always(), зелёный молчит ────
      - name: 'Замер обрыва: артефакт (150)'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zamer-proba-obryv-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/zamer-out-proba-obryv
          if-no-files-found: ignore
          retention-days: 14
  e2e-proba-drugoj:
    needs: [select-screens, build-apk]
    if: needs.select-screens.outputs['e2e-proba-drugoj'] == 'true'
    runs-on: [self-hosted, linux, x64, kvm, complior]
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      - name: Изоляция раннера (/home недоступен коду из PR)
        run: test ! -e /home/harness/.ssh && test ! -e /home/harness/dev-harness
      # ── обёртка 150, шаг 1/3 — ФОРМА F2 (npm-lane, совместимость 163) ──
      - name: 'Замер обрыва: запуск сэмплера (150)'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ZAMER_EKRAN: proba-drugoj
          ZAMER_NS: mobile/maestro-out-drugoj
          ZAMER_SERIAL: emulator-5573
        run: |
          set -euo pipefail
          npm run ci:zamer -- start \
            --ekran "$ZAMER_EKRAN" --ns "$ZAMER_NS" --serial "$ZAMER_SERIAL" \
            --spool .zamer-$ZAMER_EKRAN \
            || echo 'ZAMER_START_NE_UDALSJA (zamer idet bez semplera)' >&2
      # ── экранный шаг работника (представитель; в продукте — тело экрана) ──
      - name: 'Экранная пачка (представитель экранного шага)'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PORT=5573
          SERIAL="emulator-$PORT"
          echo "ekrannoj shag: boot + priemka + odin POVTOR po signature (kanon 143/141)"
          exit 1
      # ── обёртка 150, шаг 2/3 — ФОРМА F2 (npm-lane, совместимость 163) ──
      - name: 'Замер обрыва: сбор причинного снимка (150)'
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ZAMER_EKRAN: proba-drugoj
          ZAMER_NS: mobile/maestro-out-drugoj
          ZAMER_SERIAL: emulator-5573
        run: |
          set -u
          npm run ci:zamer -- sbor \
            --ekran "$ZAMER_EKRAN" --ns "$ZAMER_NS" --serial "$ZAMER_SERIAL" \
            --spool .zamer-$ZAMER_EKRAN --out mobile/zamer-out-$ZAMER_EKRAN
      # ── обёртка 150, шаг 3/3: публикация if:always(), зелёный молчит ────
      - name: 'Замер обрыва: артефакт (150)'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zamer-proba-drugoj-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/zamer-out-proba-drugoj
          if-no-files-found: ignore
          retention-days: 14
  # 143 v3 (frozen 143/3): новые экраны — child-строки общего матричного job.
  # 150: замер КАЖДОГО child — дочерним хуком внутри раннера (см.
  # mobile/scripts/run-ci-screen.cjs); внешний «шаг вокруг job» ничего не
  # доказывает. Единственный внешний шаг 150 — артефакт child.
  e2e-proba-matrica:
    needs: [select-screens, build-apk]
    if: needs.select-screens.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select-screens.outputs.matrix) }}
    runs-on: [self-hosted, linux, x64, kvm, complior]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      - name: Изоляция раннера (/home недоступен коду из PR)
        run: test ! -e /home/harness/.ssh && test ! -e /home/harness/dev-harness
      # ── экранный шаг child (канон 143 v3; обёртка 150 — ВНУТРИ раннера) ──
      - name: 'Run selected screen (представитель; канон 143 v3)'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SCREEN_ID: ${{ matrix.screen.id }}
          SCREEN_PACK: ${{ matrix.screen.pack }}
          SCREEN_FLOW: ${{ matrix.screen.flow }}
          AVD_PORT: ${{ matrix.screen.avd_port }}
        run: |
          set -euo pipefail
          flock "/tmp/complior-ci-port-${AVD_PORT}.lock" \
            node mobile/scripts/run-ci-screen.cjs \
            --id "$SCREEN_ID" --pack "$SCREEN_PACK" --flow "$SCREEN_FLOW" --port "$AVD_PORT"
      # ── обёртка 150, матричная публикация: артефакт КАЖДОГО child ──────
      - name: 'Замер обрыва: артефакт (150)'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zamer-${{ matrix.screen.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/zamer-out-${{ matrix.screen.id }}
          if-no-files-found: ignore
          retention-days: 14
