# Stand-in .github/workflows/mobile.yml (проводка 995/108/111/117 + 116;
# v4, 143: шаг 116 исполняет задача e2e-mission под required-агрегатом
# android-e2e): шаг 116 исполняет семью поведения/рендера Mission; блок шага
# байт-равен пину двух строк внутри задачи e2e-mission — иначе CI_BEZ_SHAGA_POVEDENIJA /
# CI_SHAG_POVEDENIJA_NE_PO_PINU (арбитраж 4cadfc54 а). Пин — source.json
# (mobile_ci_tekst).
name: mobile
on: [push]
jobs:
  e2e-mission:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: 995 bootstrap smoke
        run: npx jest src/bootstrap/__tests__
      - name: 117 pilot splash
        run: npx jest src/pilot/__tests__
      - name: 116 mission behaviour render
        run: npx jest src/features/conversation/__tests__/mission-116.test.tsx
