# 138 (start-ekran): start-ekran.yaml — сценарий ЭКРАННОЙ ПАЧКИ
# mobile/e2e-start: e2e.sh запускает его отдельным прогоном по прямому пути
# (обе темы). В общем прогоне каталога 995 (maestro test .maestro) его быть
# не должно: флоу начинается с launchApp и идёт по пути допуска 118
# (First-Run → demo → Erstinformation → continue), а порядок флоу каталога
# Maestro не гарантируется — соседний флоу может оставить приложение не на
# First-Run, и прогон каталога станет недетерминированно красным (урок 118).
# Конфиг каталога — штатный механизм Maestro: globs фильтруют ТОЛЬКО файлы
# обхода каталога; прямой запуск файла по пути фильтром не затрагивается.
flows:
  - "*"
  - "!start-ekran.yaml"
