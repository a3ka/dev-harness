openapi: 3.1.0
info:
  title: BrokerOS Unified (toy)
  version: 5.8.2
paths:
  /disclosures/{id}/acknowledge:
    post:
      operationId: acknowledgeDisclosure
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRequest'
  /actions:
    post:
      operationId: requestAction
      responses:
        '200': {description: ok}
components:
  schemas:
    ActionRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/ReasonCode'
    ReasonCode:
      type: string
      enum: [OK, CAS_STALE]
