# Проход проходимости пачки gespraech-tekst (контракт 149): каждое
# нажатие видимой цели даёт наблюдаемое изменение (assertVisible/
# assertNotVisible); пустых нажатий нет. Демо-переключателей нет.
# Голосовые цели (микрофоны плашек/поля, «Lieber erzählen?») — мок-хост
# до контрактов 150/151 (норма пилота 28.10): мок отвечает состоянием.
appId: com.complior.mobile
name: gespraech-tekst-prokhod
