# Проход проходимости пачки gespraech-vhod (контракт 147): каждое нажатие
# видимой цели даёт наблюдаемое изменение (assertVisible/assertNotVisible);
# пустых нажатий нет. Демо-переключателей на экране нет.
appId: com.complior.mobile
name: gespraech-prokhod
