- tapOn:
    id: shell-tab-post
- assertVisible:
    id: post
- tapOn:
    id: gespraech-vorgaenge-ansehen
- assertVisible:
    id: vorgaenge
- tapOn:
    id: gespraech-mitte
- assertVisible:
    id: gespraech-menu
- tapOn:
    id: gespraech-menu-sprechen
- assertVisible:
    id: gespraech-voice
- tapOn:
    id: gespraech-beenden
- tapOn:
    id: gespraech-mitte
- tapOn:
    id: gespraech-menu-schreiben
- assertVisible:
