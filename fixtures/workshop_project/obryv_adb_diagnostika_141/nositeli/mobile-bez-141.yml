name: mobile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    runs-on: [self-hosted, linux, x64, complior]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 995 (CMP-MOB-001) + 999 (CMP-MOB-002) + 108 (CMP-MOB-004) +
      # 111 (CMP-MOB-005): единый H-пин принятого харнеса
      # c663dd0fb0b233e56368707aef6940baaf254a30 несёт четыре семейства
      # проб — pilot_995 (перепин после CMP-MOB-003/107), nav_999,
      # start_108 (336 клеток: 324 поведенческих + 12 ROUTE/ENTRY;
      # матрица 42 поведенческих + 5 статических мутантов), first_run_111
      # (v4: статическая 16/16 + поведенческая 23/23, матрица 16 статических +
      # 34 поведенческих мутантов; К5 требует НАЛИЧИЯ и не-скрытости обеих
      # строк макета — podzagolovok «Ein Brief, ein Schaden, …» и futer
      # «Versicherung. Erledigt.» — в ОБЕИХ схемах; +4 клетки
      # RESTYLE_GUARD_995_F03_01_{DARK,LIGHT} и
      # RESTYLE_GUARD_995_WELCOME_{DARK,LIGHT} по совету С10/Р2 ревьюера круга 3).
      # Числа батареи 111 — замер на пине 66b9fe1c46de75abe3263982ed2a2d8ae50c19d6
      # (до перепина на 8d3f48b886b180689114f15bc90c8d13bcd8480f): static 16/16 rc0, honest 19/19 rc0,
      # матрица rc0 (15 статических + 24 поведенческих мутанта); регресс
      # 995 --check-frozen rc0, 999 четыре пробы rc0, 108 static 22/22 + honest
      # 336/336 rc0; npm lint/typecheck/test rc0.
      # frozen-пробы 995/999/start_108/111
      # держатся одним checkout, без дрейфа между шагами. cmp блокирует
      # job до запуска npm test при дрейфе, потом идут проб-Jest/RNTL
      # на disposable-копии в /tmp; quality-job прогоняет пробы 995,
      # четыре пробы 999, две пробы 108 и две пробы 111; --matrix
      # остаётся для арбитража.
      # ПЕРЕПИН H 2026-10-23: 8d3f48b886b180689114f15bc90c8d13bcd8480f →
      # c663dd0fb0b233e56368707aef6940baaf254a30 (origin/main харнесса) —
      # несёт frozen/contracts/111/4: каталог копии First-Run v4 (обе строки
      # макета обязательны на экране; видимость судит закрытый перечень
      # скрытий). Между пинами pilot_995/nav_999/start_108 не менялись;
      # vkhod_117 менялся (117 v3 не заморожен: frozen/contracts/117/3 нет) —
      # потому .harness117 остаётся на своём пине, а .harness (995/999/108/111)
      # и .harness117 читают разные ревизии намеренно. Числа замера на новом
      # пине (свои прогоны): 111 honest 23/23 rc0, 111 --model 23/23 rc0,
      # 111 --matrix rc0 (34 стаба, каждый красен своей именованной ветвью),
      # 111 static 16/16 rc0, 111 static --matrix rc0 (16 стабов); регресс
      # 995 --check-frozen rc0, 999 четыре пробы rc0, 108 static 22/22 + honest
      # 336/336 rc0; npm test/lint/typecheck rc0.
      # ПЕРЕПИН H 2026-10-21 (история): 66b9fe1c46de75abe3263982ed2a2d8ae50c19d6 →
      # 8d3f48b886b180689114f15bc90c8d13bcd8480f (origin/main харнесса),
      # который принёс батарею 117 v2 (fixtures/workshop_project/vkhod_117;
      # frozen/contracts/117/2 — предок этого коммита) и семейства
      # 995/999/108/111; тогда .harness и .harness117 стали одним SHA.
      # Пин .harness117 (батарея 117) НЕ переписывается: остаётся на
      # 8d3f48b886b180689114f15bc90c8d13bcd8480f (frozen/contracts/117/2).
      # Пин .harness123 (сверка кадров 123) НЕ переписывается: по
      # source.json sverka_123.provodka «перепин .harness123 — дело 123»,
      # а клетка SVERKA_123_HARNESS_PIN сверяет ref только как 40-hex.
      # ПЕРЕПИН H 2026-10-25 (контракт 118 v2, §ПРЕДПОСЫЛКИ: «перепин H …
      # на ревизию с этими данными ДО продуктового зелёного»):
      # c663dd0fb0b233e56368707aef6940baaf254a30 →
      # b9b4c66f3d84dc8aa7eb7c8e83b466e807817416 (main харнесса) — ревизия
      # несёт ленд данных 995 (871d04eb: session.expires_at 2026-10-14 →
      # 2099-12-31 в fixtures/workshop_project/pilot_995/source.json, слово
      # владельца 25.10); cmp-шаг ниже требует байт-равенства продукта и H.
      # Между c663dd0f и b9b4c66f3 в pilot_995/nav_999/start_108/
      # first_run_111 и scripts/ekran_shablon.py/sverka_maketa.py
      # изменился ТОЛЬКО этот литерал (git diff --stat), пробы не тронуты.
      - name: Checkout frozen probe harness H
        uses: actions/checkout@v7
        with:
          repository: a3ka/dev-harness
          ref: b9b4c66f3d84dc8aa7eb7c8e83b466e807817416
          path: .harness
          persist-credentials: false
      - name: cmp frozen pilot.test.tsx + source.json с H
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          test -f mobile/src/bootstrap/__tests__/pilot.test.tsx
          test -f mobile/src/bootstrap/__tests__/source.json
          cmp mobile/src/bootstrap/__tests__/pilot.test.tsx .harness/fixtures/workshop_project/pilot_995/pilot.test.tsx
          cmp mobile/src/bootstrap/__tests__/source.json .harness/fixtures/workshop_project/pilot_995/source.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: probe.py --check-frozen (H, --repo disposable R)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/dev-harness-verify
          cp -a . /tmp/dev-harness-verify/impl995-r-${{ github.run_id }}-${{ github.run_attempt }}
          python3 -m pip install -r /tmp/dev-harness-verify/impl995-r-${{ github.run_id }}-${{ github.run_attempt }}/.harness/fixtures/workshop_project/pilot_995/requirements.txt
          cd /tmp/dev-harness-verify/impl995-r-${{ github.run_id }}-${{ github.run_attempt }}
          python3 .harness/fixtures/workshop_project/pilot_995/probe.py --repo . --check-frozen
      - name: runtime_probe.py, bundle_probe.py, schema_probe.py, frozen_matrix.py, transport_probe.py, admission_probe.py, stale_probe.py, types_probe.py, pins_probe.py, admission_family_probe.py, stale_table_probe.py (H, --repo disposable R)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          cd /tmp/dev-harness-verify/impl995-r-${{ github.run_id }}-${{ github.run_attempt }}
          python3 .harness/fixtures/workshop_project/pilot_995/runtime_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/bundle_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/schema_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/frozen_matrix.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/transport_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/admission_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/stale_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/types_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/pins_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/admission_family_probe.py --repo .
          python3 .harness/fixtures/workshop_project/pilot_995/stale_table_probe.py --repo .
      # 999 (CMP-MOB-002): навигация Start/Vorgänge/Schutz/Post и токены D2.2.5.1.
      # H принятого харнеса закреплён за frozen/contracts/999/1 (c9f680b4d);
      # четыре пробы (nav 238, ui 18, static 6, copy 51) исполняются на
      # disposable-копии в /tmp; --matrix остаётся для арбитража.
      - name: 999 nav_probe.py / ui_probe.py / shell_static_probe.py / copy_probe.py (H, --repo disposable R)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/dev-harness-verify
          cp -a . /tmp/dev-harness-verify/impl999-r-${{ github.run_id }}-${{ github.run_attempt }}
          cd /tmp/dev-harness-verify/impl999-r-${{ github.run_id }}-${{ github.run_attempt }}
          python3 .harness/fixtures/workshop_project/nav_999/nav_probe.py --repo .
          python3 .harness/fixtures/workshop_project/nav_999/ui_probe.py --repo .
          python3 .harness/fixtures/workshop_project/nav_999/shell_static_probe.py --repo .
          python3 .harness/fixtures/workshop_project/nav_999/copy_probe.py --repo .
      # 108 (CMP-MOB-004): Start F04.01–F04.07 — статическая проба (22/22)
      # и поведенческая проба (336/336 на честном C, с ROUTE_ENTRY;
      # на B — rc1 START_SEAM_ABSENT). Шаг 108 берёт тот же checkout H,
      # что 995/999/111 — c663dd0fb0b233e56368707aef6940baaf254a30 (шаг
      # «Checkout frozen probe harness H» выше); отдельного H-пина 108
      # нет. Матрица 42 поведенческих + 5 статических мутантов. Перепин H
      # на 66b9fe1c46de75abe3263982ed2a2d8ae50c19d6 (ленд wip/111/architect: клетки
      # RESTYLE_GUARD_995_* круга 4) выполнен; текущий пин —
      # c663dd0fb0b233e56368707aef6940baaf254a30: оба checkout (quality и
      # android-e2e) читают одну ревизию.
      # frozen-шаги 995/999 сохранены дословно. --matrix — для арбитража.
      - name: 108 start_static_probe.py / start_probe.py (H, --repo disposable R)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/dev-harness-verify
          cp -a . /tmp/dev-harness-verify/impl108-r-${{ github.run_id }}-${{ github.run_attempt }}
          cd /tmp/dev-harness-verify/impl108-r-${{ github.run_id }}-${{ github.run_attempt }}
          python3 .harness/fixtures/workshop_project/start_108/start_static_probe.py --repo .
          python3 .harness/fixtures/workshop_project/start_108/start_probe.py --repo .
      # 111 (CMP-MOB-005): First-Run по D2.2.5.1 — статическая проба 16/16
      # и поведенческая проба 23/23 на честном C (на B — rc1
      # FIRST_RUN_SEAM_ABSENT). Шаг 111 берёт тот же checkout H, что
      # 995/999/108 — c663dd0fb0b233e56368707aef6940baaf254a30 (шаг
      # «Checkout frozen probe harness H» выше); отдельного H-пина 111 нет.
      # Матрица 16 статических + 34 поведенческих мутантов
      # (+4 клетки RESTYLE_GUARD_995_* круга 4 по совету С10/Р2 ревьюера).
      # Перепин H на 66b9fe1c46de75abe3263982ed2a2d8ae50c19d6 (ленд wip/111/architect: клетки
      # RESTYLE_GUARD_995_* круга 4) выполнен; текущий пин —
      # c663dd0fb0b233e56368707aef6940baaf254a30: оба checkout (quality и
      # android-e2e) читают одну ревизию. frozen-шаги 995/999/108
      # сохранены дословно. --matrix — для арбитража.
      - name: 111 first_run_static_probe.py / first_run_probe.py (H, --repo disposable R)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/dev-harness-verify
          cp -a . /tmp/dev-harness-verify/impl111-r-${{ github.run_id }}-${{ github.run_attempt }}
          cd /tmp/dev-harness-verify/impl111-r-${{ github.run_id }}-${{ github.run_attempt }}
          python3 .harness/fixtures/workshop_project/first_run_111/first_run_static_probe.py --repo .
          python3 .harness/fixtures/workshop_project/first_run_111/first_run_probe.py --repo .
      # 117 (CMP-MOB-006): вход F03.01/F03.02 по D2.2.5.1 + НАШ нативный
      # splash/иконка. Батарея vkhod_117 (поведенческая 22 клетки RNTL +
      # статическая 35 клеток: ассеты, app.json, произведённые drawable,
      # композиты по эталону артбордов) пиннится отдельным checkout в свой путь
      # .harness117 — отдельного ревизионного SHA больше нет: перепин
      # 2026-10-21 поставил .harness117 на тот же
      # 8d3f48b886b180689114f15bc90c8d13bcd8480f, что и .harness был тогда
      # (батарея 117 v2 приехала в общий H; на 66b9fe1c46de75abe3263982ed2a2d8ae50c19d6,
      # до перепина, её не было — отсюда и был отдельный коммит
      # frozen/contracts/117/1 = 8d2a7fcfb6a38193a1f9bc05505bde33e8532e57).
      # Перепин 2026-10-23 (H .harness → c663dd0fb0b233e56368707aef6940baaf254a30)
      # .harness117 НЕ тронул: батарея 117 v2 — замороженная ревизия
      # (frozen/contracts/117/2), а на новом пине файлы vkhod_117 отличаются
      # (117 v3 не заморожен: frozen/contracts/117/3 нет).
      # Свой путь нужен, чтобы шаг 117 читал батарею из .harness117, пока
      # .harness (995/999/108/111) выносится из дерева до lint. Шаг читает
      # батарею из этого checkout и гоняет её на disposable-копии R тем же
      # механизмом, что 995/999/108/111.
      - name: Checkout probe battery 117 (frozen/contracts/117/1)
        uses: actions/checkout@v7
        with:
          repository: a3ka/dev-harness
          ref: 8d3f48b886b180689114f15bc90c8d13bcd8480f
          path: .harness117
          persist-credentials: false
      # Контракт 117 v2 «Приёмочный критерий»: пробы — Python 3 stdlib
      # (+ pyyaml для клеток Maestro; отсутствие — rc2 INFRASTRUCTURE).
      # Шаг install-pyyaml-pyyaml явно ставит pyyaml==6.0.1 (версия, на которой
      # батарея замерена локально на 6.0.1; pip уже на python 3.12 из
      # setup-python@v7 выше). Шаг безусловный, НЕ пропускается при
      # ранее установленной pyyaml — контракт 117 v2 этого требует.
      # android-e2e НЕ нуждается: пробы 117 (vkhod_static_probe / vkhod_probe)
      # в android-e2e не запускаются (там Maestro на release APK —
      # .maestro/vkhod-117-splash-vhod.yaml, без импорта yaml на уровне модуля).
      - name: 'pyyaml для клеток Maestro батареи 117 (контракт 117 v2: приёмка)'
        working-directory: ${{ github.workspace }}
        run: python3 -m pip install 'pyyaml==6.0.1'
      - name: 117 vkhod_static_probe.py / vkhod_probe.py (батарея 117, --repo disposable R)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/dev-harness-verify
          cp -a . /tmp/dev-harness-verify/impl117-r-${{ github.run_id }}-${{ github.run_attempt }}
          cd /tmp/dev-harness-verify/impl117-r-${{ github.run_id }}-${{ github.run_attempt }}
          rm -rf .harness
          python3 .harness117/fixtures/workshop_project/vkhod_117/vkhod_static_probe.py --repo .
          python3 .harness117/fixtures/workshop_project/vkhod_117/vkhod_probe.py --repo .
      # 118 (Erstinformation): пачка экрана mobile/e2e-erstinformation и файл
      # пробы композиции mobile/src/bootstrap/__tests__/kompozicija.stand-in.sh
      # выносятся из дерева тем же шагом, что и пачка 135 — layout-проверка
      # (structure-policy.json) их не знает, как и .harness/.harness117.
      # Шаги 107/117 выше дословно.
      - name: Вынести H, батарею 117 и пачки 135/118 из дерева до lint (layout-проверка не должна их видеть)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/dev-harness-verify
          mv .harness /tmp/dev-harness-verify/impl995-h-${{ github.run_id }}-${{ github.run_attempt }}
          mv .harness117 /tmp/dev-harness-verify/impl117-b-${{ github.run_id }}-${{ github.run_attempt }}
          mv mobile/e2e-first-run /tmp/dev-harness-verify/impl135-pack-${{ github.run_id }}-${{ github.run_attempt }}
          mv mobile/e2e-erstinformation /tmp/dev-harness-verify/impl118-pack-${{ github.run_id }}-${{ github.run_attempt }}
          mv mobile/src/bootstrap/__tests__/kompozicija.stand-in.sh /tmp/dev-harness-verify/impl118-probe-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'

  # Серверный раннер станции (быстрая проверка, не независимый судья).
  # Независимая сверка на чистой облачной машине — workflow mobile-cloud-e2e.
  android-e2e:
    needs: quality
    runs-on: [self-hosted, linux, x64, kvm, complior]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      # 995 (CMP-MOB-001): тот же frozen H публикуется через actions/checkout в шаге
      # android-e2e; maestro_probe.py исполняется из R/.harness и читает frozen pilot.yaml
      # и scripts/ci-e2e.sh; эмулятор и его приватный cwd живут внутри runner-а.
      # H = b9b4c66f3d84dc8aa7eb7c8e83b466e807817416 — единый пин с quality-job
      # (ПЕРЕПИН 2026-10-25, контракт 118 v2 §ПРЕДПОСЫЛКИ: ревизия несёт ленд
      # данных 995 — session.expires_at → 2099-12-31T00:00:00Z в
      # fixtures/workshop_project/pilot_995/source.json; между c663dd0f и
      # b9b4c66f3 в батареях pilot_995/nav_999/start_108/first_run_111 и
      # scripts/ изменился ТОЛЬКО этот литерал):
      # pilot_995, nav_999, start_108 (336 клеток + ROUTE_ENTRY, матрица 42+5),
      # first_run_111 (v4: статическая 16/16 + поведенческая 23/23, матрица 16+34).
      - name: Checkout frozen probe harness H
        uses: actions/checkout@v7
        with:
          repository: a3ka/dev-harness
          ref: b9b4c66f3d84dc8aa7eb7c8e83b466e807817416
          path: .harness
          persist-credentials: false
      - name: Изоляция раннера (/home недоступен коду из PR)
        run: test ! -e /home/harness/.ssh && test ! -e /home/harness/dev-harness
      - name: Версия Node совпадает с .node-version
        working-directory: ${{ github.workspace }}
        run: test "$(node -v)" = "v$(cat .node-version)"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Сборка release-APK (JS внутри, без Metro; только x86_64)
        env:
          EXPO_PUBLIC_API_MODE: mock
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=4
      # 995 (CMP-MOB-001): frozen pilot.yaml + секрет кода — PRIVATE_FILE вне репо/артефактов;
      # maestro_probe.py сам управляет эмулятором через ci-e2e.sh в приватном cwd.
      - name: H-pин приватного кода вне checkout
        env:
          PILOT_DEMO_CODE: ${{ secrets.PILOT_DEMO_CODE }}
        run: |
          if [ -z "$PILOT_DEMO_CODE" ]; then
            echo "PILOT_DEMO_CODE_ABSENT" >&2
            exit 1
          fi
          umask 077
          mkdir -p /tmp/impl995-pilot-private-${{ github.run_id }}-${{ github.run_attempt }}
          printf '%s' "$PILOT_DEMO_CODE" > /tmp/impl995-pilot-private-${{ github.run_id }}-${{ github.run_attempt }}/code
      - name: Maestro runner для CMP-MOB-001 (через maestro_probe.py → ci-e2e.sh)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          python3 -m pip install -r .harness/fixtures/workshop_project/pilot_995/requirements.txt
          python3 .harness/fixtures/workshop_project/pilot_995/maestro_probe.py \
            --repo ${{ github.workspace }} \
            --apk ${{ github.workspace }}/mobile/android/app/build/outputs/apk/release/app-release.apk \
            --code-file /tmp/impl995-pilot-private-${{ github.run_id }}-${{ github.run_attempt }}/code \
            --out ${{ github.workspace }}/mobile/maestro-out
      - name: Cleanup private code file
        if: always()
        run: rm -rf /tmp/impl995-pilot-private-${{ github.run_id }}-${{ github.run_attempt }}
      # 117 (CMP-MOB-006, арбитраж круга 2, ПРАВИЛО (В)): доказательство Б3
      # «кадр целиком в окне» и кадры по правилу (В) — Maestro на release APK
      # (Expo Go картинку плагина не показывает, С1). Свой эмулятор прогона
      # 117: ОДИН сценарий .maestro/vkhod-117-splash-vhod.yaml исполняется
      # дважды — тема ОС переключается между прогонами (cmd uimode night),
      # каталог вывода несёт схему; assertVisible — каждый элемент состава
      # кадра, takeScreenshot — каждый кадр. Артефакты (скриншоты + JUnit)
      # уходят в maestro-out-117 отдельным шагом ниже.
      - name: 117 splash/F03.01/F03.02 × тема (Maestro, release APK)
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          AVD="ci117-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PORT=5562
          SERIAL="emulator-${PORT}"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          cleanup117() {
            adb -s "$SERIAL" emu kill >/dev/null 2>&1 || true
            sleep 3
            pkill -f "qemu-system-x86_64.*-avd $AVD" >/dev/null 2>&1 || true
            "$AVDM" delete avd -n "$AVD" >/dev/null 2>&1 || true
          }
          trap cleanup117 EXIT
          echo no | "$AVDM" create avd --force -n "$AVD" \
            -k "system-images;android-36;google_apis;x86_64" -d pixel_7 >/dev/null
          sed -i 's/^hw.ramSize=.*/hw.ramSize=2048/' "$ANDROID_AVD_HOME/$AVD.avd/config.ini"
          adb start-server >/dev/null

          # adb-транспорт эмулятора иногда кратко уходит в offline (PR #114, шаги 995 и 117:
          # «device offline» / «device <...> not found» / DeviceServerDiedException). Ждём, пока
          # adb стабильно отвечает на shell pm path android три проверки подряд.
          wait_stable117() {
            local ok=0
            for _ in $(seq 1 40); do
              if [ "$(adb -s "$SERIAL" get-state 2>/dev/null)" = "device" ] &&
                 adb -s "$SERIAL" shell pm path android >/dev/null 2>&1; then
                ok=$((ok + 1)); [ "$ok" -ge 3 ] && return 0
              else
                ok=0
              fi
              sleep 2
            done
            echo "ОТКАЗ: эмулятор $SERIAL не стабилизировался (adb offline)" >&2
            return 1
          }

          boot_emulator() {
            emulator -avd "$AVD" -port "$PORT" -no-window -no-audio -no-boot-anim -no-snapshot \
              -gpu swiftshader_indirect >"emulator-$AVD.log" 2>&1 &
            adb -s "$SERIAL" wait-for-device
            for _ in $(seq 1 130); do
              [ "$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
              sleep 3
            done
            [ "$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] || {
              echo "ОТКАЗ: эмулятор 117 не загрузился за 390 с" >&2; return 1; }
            wait_stable117
            for s in window_animation_scale transition_animation_scale animator_duration_scale; do
              adb -s "$SERIAL" shell settings put global "$s" 0
            done
            adb -s "$SERIAL" install -r "$APK" >/dev/null
          }

          # Прогон темы ровно один раз; при сигнатуре обрыва adb-транспорта в выводе темы —
          # перезапуск эмулятора и второй (последний) прогон этой темы с чистым каталогом.
          # Провал assert/assertVisible (rc≠0 без сигнатуры) — НЕ повторяется.
          run_theme() {
            local theme="$1" night
            if [ "$theme" = "dark" ]; then night=yes; else night=no; fi
            adb -s "$SERIAL" shell cmd uimode night "$night"
            sleep 2
            rm -rf "maestro-out-117/$theme"
            set +e
            maestro --device "$SERIAL" test --format junit \
              --output "maestro-out-117/report-$theme.xml" \
              --test-output-dir "maestro-out-117/$theme" \
              .maestro/vkhod-117-splash-vhod.yaml
            local rc=$?
            set -e
            if [ "$rc" -ne 0 ] && grep -rqE 'device offline|device .* not found|DeviceServerDiedException' "maestro-out-117/$theme" 2>/dev/null; then
              echo "ПОВТОР: обрыв adb-транспорта эмулятора — перезапуск и повтор темы $theme" >&2
              adb -s "$SERIAL" emu kill >/dev/null 2>&1 || true
              sleep 3
              pkill -f "qemu-system-x86_64.*-avd $AVD" >/dev/null 2>&1 || true
              boot_emulator
              adb -s "$SERIAL" shell cmd uimode night "$night"
              sleep 2
              rm -rf "maestro-out-117/$theme"
              set +e
              maestro --device "$SERIAL" test --format junit \
                --output "maestro-out-117/report-$theme.xml" \
                --test-output-dir "maestro-out-117/$theme" \
                .maestro/vkhod-117-splash-vhod.yaml
              rc=$?
              set -e
            fi
            return "$rc"
          }

          boot_emulator
          rm -rf maestro-out-117
          for theme in dark light; do
            run_theme "$theme" || { echo "ПОВТОРЫ ИСЧЕРПАНЫ: тема $theme" >&2; exit 1; }
          done
      # 123 (CMP-MOB-007, mob-sverka-maketa): сверка кадров, снятых шагом
      # 117 выше, с PNG-макетами D2.2.5.1 в docs/ux. Шаг стоит ПОСЛЕ «117
      # splash/F03.01/F03.02 × тема» (кадры mobile/maestro-out-117 уже на
      # диске) и ДО «Артефакты 117» (if: always() выгружает и кадры, и tsv).
      # пин .harness123 перепинен на 123 v2: манифест kadry_117 = Splash dark/light, слово владельца ~20:00 UTC «А»
      # Без continue-on-error: кадр ниже порога 0,600 — шаг rc 1, job android-e2e = failure,
      # лог несёт NIZHE_POROGA<TAB><id кадра>, артефакт
# mobile/maestro-out-117/sverka-123.tsv — 2 строки KADR (kadry_117.json v2: Splash dark/light).
      - name: Checkout scripts/sverka_maketa.py (mob-sverka-123 implementation)
        uses: actions/checkout@v7
        with:
          repository: a3ka/dev-harness
          ref: 5d98a1cd745ce08eeb21b89f8e05750c4e769a0e
