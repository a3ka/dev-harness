      - name: Артефакты 117 (кадры по правилу (В), отчёт)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-117-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/maestro-out-117
          if-no-files-found: error
          retention-days: 14
      # 135 (CMP-MOB-008, first-run-ekran): экранная пачка mobile/e2e-first-run
      # (First-Run + вход F03.01/F03.02/F03.02-V01, 8 кадров). Пин .harness135
