appId: com.complior.mobile
name: 117 — splash (схема устройства)
---
# 117 v2 (CMP-MOB-006, сужение до splash + иконка; арбитраж круга 2,
# ПРАВИЛО (В)): холодный старт = нативный знак канона на ground СХЕМЫ
# (app.json: корень светлый + вложенный dark) → JS-ОВЕРЛЕЙ кадра
# Splash.png/Splash-Hell.png (testID splash-overlay) → First-Run 111.
# Вход F03.01/F03.02 выведен в first-run-ekran — кадров входа здесь нет.
#
# Сценарий ОДИН на обе схемы: тему ОС ставит вызывающая сторона
# (android-e2e: adb shell cmd uimode night yes|no), каталог вывода
# прогона несёт схему (maestro-out-117/<тема>/), поэтому имена кадров
# здесь без темы. Сценарий не судит цвета: видимость и раскладку кадра
# splash судит сверка кадра e2e с макетом (123, манифест kadry_117.json:
# снимок vkhod-117-splash × тема против Splash.png/Splash-Hell.png).
#
# Р2/Р3 (круг 6, Rev117/Adv117): кадр — свидетельство, а не надежда.
# (а) Шаг непосредственно перед takeScreenshot splash — ожидание
#     видимости оверлея splash-overlay (extendedWaitUntil visible): иной
#     шаг между ожиданием и снимком (ожидание First-Run, исчезновения
#     оверлея) снял бы под именем splash другой кадр.
# (б) Перед takeScreenshot first-run оверлей обязан ИСЧЕЗНУТЬ
#     (extendedWaitUntil notVisible по splash-overlay) — свидетельство
#     снятия оверлея; экран First-Run судит first-run-ekran, не 117.
# Если оверлей исчезает раньше ожидания — это дизайн-вопрос
# implementer'а (задержка скрытия оверлея); сценарий судит факт снятия.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: splash-overlay
    timeout: 10000
- takeScreenshot: vkhod-117-splash
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- takeScreenshot: vkhod-117-first-run
