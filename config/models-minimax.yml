# Оверлей: живая сессия на MiniMax-M3.
#
# Накладывается поверх `.omp/config.yml` при запуске:
#   ./workshop <проект> --models config/models-minimax.yml
#
# ЗАЧЕМ. Расход живой сессии сегодня не считается НИГДЕ. Измерено: через прокси учёта идёт
# только `minimax`; слова `anthropic` в коде прокси нет ни разу, а трейс сессии пишет лишь
# начало вызова инструмента и не содержит ни результатов, ни расхода. То есть самый крупный
# потребитель квоты — единственный, у которого нет ни потолка, ни строки в гроссбухе.
# Перевод сессии на MiniMax делает её расход видимым, потому что этот провайдер маршрутизирован.
#
# ЧЕМ ЭТО РИСКОВАННО. Живая сессия — место, где больше всего вызовов инструментов и все
# правки по номерам строк. Их отказы выглядят как продвижение: правка «легла», но не туда.
# Проверить это по трейсу нечем — результаты в нём не пишутся. Значит сравнение возможно
# только по наблюдаемому исходу работы: сколько кругов до зелёных фикстур и предъявлен ли
# сырой вывод без напоминания.
#
# ЧТО СРАВНИМО НА БУМАГЕ. Контекст 1M, вывод 128K и vision — у обеих моделей. Разница одна:
# глубина размышления, `max` у claude-sonnet-5 против `high` у MiniMax-M3.
#
# ПОРЯДОК. Пробовать на ОГРАНИЧЕННОЙ задаче с готовыми фикстурами, а не на нормативном
# документе: там ошибка наследуется всем, что построят потом.

modelRoles:
  # Живая сессия. Роли судей и арбитра оверлей НЕ трогает: они обязаны остаться вне семейства
  # автора, а с переводом сессии на MiniMax автором становится оно.
  default: "minimax/MiniMax-M3"
  vision: "minimax/MiniMax-M3"
