# Оверлей: живая сессия на MiniMax (дешёвый+считаемый ход).
#
#   ./workshop --models config/models-minimax.yml            (работа НАД инструментом)
#   ./workshop <проект> --models config/models-minimax.yml   (работа с проектом)
#
# ЗАЧЕМ. Экономия: GLM/Opus дороги и мимо прокси учёта. MiniMax дёшев И ВИДИМ: его расход
# идёт через прокси учёта в гроссбух. Решение владельца 2026-08-23 после дорогой Opus-сессии.
#
# ПОЧЕМУ `default`. Живую сессию ведёт роль `orchestrator` на тире `default`
# (config/agent_models.json, секция roles). До 2026-09-26 здесь стоял `slow` — остаток
# времён, когда сессию вела роль `architect`; тогда оверлей переводил на MiniMax не сессию, а
# субагента architect, вопреки заголовку.
#
# МОДЕЛЬ — ссылка на семейство `@minimax`: версия живёт одной строкой в
# config/agent_models.json (секция models), лаунчер разворачивает ссылку при запуске. Расход
# считается прокси (require_metering требует METERING_PROXY_URL/TOKEN — они уже нужны базовым ролям).

modelRoles:
  default: "@minimax"
