# Оверлей: субагент architect (тир `slow`) на Anthropic Opus.
#
#   ./workshop --models config/models-opus.yml            (работа НАД инструментом)
#   ./workshop <проект> --models config/models-opus.yml   (работа с проектом)
#
# ЗАЧЕМ. Обратный ход, когда недельная квота z.ai (роль `slow` = glm-5.2) исчерпана, а работа
# стоять не может. Не норма: умолчание — GLM/MiniMax (решение владельца 2026-08-16/08-17).
#
# ПОЧЕМУ ИМЕННО `slow`. Тир `slow` — роль `architect` (config/agent_models.json, секция roles).
# Живую сессию ведёт `orchestrator` на тире `default`: её этот оверлей НЕ переключает — для
# сессии на Opus есть отдельный личный оверлей с `default: "@opus"`.
#
# МОДЕЛЬ — ссылка на семейство `@opus`: версия живёт ОДНОЙ строкой в config/agent_models.json
# (секция models), лаунчер разворачивает ссылку при запуске. Окно 1M — тем же основанием, что
# и у тира slow: длинная стенограмма не должна идти со сжатием истории.
#
# ЧЕГО ЭТОТ ОВЕРЛЕЙ СТОИТ, кроме денег. Расход Anthropic не считается НИГДЕ — ни через прокси
# учёта, ни в трейсе (.omp/config.yml:23-25). Взял оверлей — записывай зачем, механизм не
# запишет. Прокси учёта всё равно требуется: базовые роли (default/task/smol) остаются на
# minimax, и require_metering по-прежнему проверяет METERING_PROXY_URL/TOKEN.

modelRoles:
  slow: "@opus"
