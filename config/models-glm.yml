# Оверлей: живая сессия на z.ai/GLM (обратный ход, не норма).
#
#   ./workshop --models config/models-glm.yml
#
# Заведён 2026-08-25 по слову владельца: Anthropic-лимиты кончаются, живую сессию временно
# на GLM. Умолчание — MiniMax (решение 2026-08-16); это временный обратный ход, записывай зачем.
#
# ВАЖНО — vision. Ведущая сессия (@default) требует картинки (кадры смотрит глазами), а
# `glm-5.2` ТЕКСТОВАЯ (omp models list: images=no) — overlay-гейт её отвергнет. Поэтому здесь
# `glm-5v-turbo` (images=yes), ценой окна: 200K вместо 1M у glm-5.2. Для оркестрации/git/дерева
# 200K хватает; если упрёшься в окно на большом дереве — вернись на MiniMax (дефолт) или Sonnet.
#
# ЦЕНА невидимости: расход z.ai идёт по подписке, НЕ через прокси учёта — в трейсе его нет,
# как и у Anthropic. Тратишь вслепую; записывай зачем.

modelRoles:
  default: "zai/glm-5v-turbo"
  vision: "zai/glm-5v-turbo"