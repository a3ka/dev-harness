# Оверлей: живая сессия на z.ai/GLM (обратный ход, не норма).
#
#   ./workshop --models config/models-glm.yml
#
# Заведён 2026-08-25 по слову владельца: Anthropic-лимиты кончаются, живую сессию временно
# на GLM. С 2026-09-12 базовый тир `default` уже GLM (config/agent_models.json) — оверлей
# совпадает с базой и нужен, только если базу переведут на другое семейство.
#
# ПОЧЕМУ текстовая GLM с окном 1M, а НЕ vision-версия с 200K: оркестратор картинки не
# смотрит — в его инвентаре нет `inspect_image`, значит vision ему не нужен функционально;
# для дерева/вердиктов/контекста окно важнее картинок. `vision`-роль НЕ трогаем: кадр уйдёт
# туда, не на glm.
#
# МОДЕЛЬ — ссылка на семейство `@glm`: версия живёт одной строкой в config/agent_models.json
# (секция models), лаунчер разворачивает ссылку при запуске. Расход z.ai по подписке, в
# трейсе/прокси НЕ виден — трать с оглядкой.

modelRoles:
  default: "@glm"