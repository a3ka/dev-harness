# Оверлей: живая сессия на z.ai/GLM (обратный ход, не норма).
#
#   ./workshop --models config/models-glm.yml
#
# Заведён 2026-08-25 по слову владельца: Anthropic-лимиты кончаются, живую сессию временно
# на GLM. Умолчание — MiniMax (решение 2026-08-16); временный обратный ход, записывай зачем.
#
# ПОЧЕМУ glm-5.2 (1M), а НЕ glm-5v-turbo (200K): оркестратор картинки не смотрит — в его
# инвентаре нет `inspect_image` (read, grep, glob, bash, edit, task, todo, hub), значит vision
# ему не нужен функционально. glm-5.2 текстовая (images=no), зато окно 1M против 200K у
# vision-версии — для дерева/вердиктов/контекста окно важнее картинок. `vision`-роль НЕ трогаем:
# останется дефолтная (minimax/MiniMax-M3, images=yes) — если какой-то РОЛИ с `inspect_image`
# понадобится кадр, он уйдёт туда, не на glm.
#
# overlay-гейт (`npm run overlay`) судит config.yml (default=minimax, vision=yes), НЕ этот
# runtime-оверлей — потому glm-5.2 здесь его не валит. Расход z.ai по подписке, в трейсе/прокси
# НЕ виден — трать с оглядкой.

modelRoles:
  default: "zai/glm-5.2"