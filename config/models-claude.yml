# Оверлей: живая сессия на Anthropic.
#
#   ./workshop <проект> --models config/models-claude.yml
#
# Умолчание — MiniMax (решение владельца 2026-08-16): подписка Anthropic обслуживает несколько
# его проектов, то есть общий ограниченный ресурс, а квота MiniMax дешёвая и расширяемая.
# Этот файл — обратный ход, а не норма.
#
# КОГДА ИМ ПОЛЬЗОВАТЬСЯ. Задача, где ошибка наследуется: правка нормативного документа,
# проектирование контура, разбор спора. Признак простой — если результат будет основанием для
# следующих работ, а не одним механизмом, глубина размышления важнее цены.
#
# ЧЕГО ОН СТОИТ, кроме денег. Расход Anthropic не считается НИГДЕ: через прокси учёта он не
# идёт, в трейсе его нет. Значит с этим оверлеем сессия тратит невидимо — и это не оценка, а
# измеренное свойство. Взял оверлей — записывай зачем, потому что механизм не запишет.

